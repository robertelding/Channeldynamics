   {
    "slug": "usability-101-a-quick-introduction-to-usability-ux",
    "title": "Usability 101, A Quick Introduction to Usability & UX",
    "date": "2015-04-10",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-3.jpg",
    "excerpt": "",
    "body": "What is usability and how can we define it?\n\nSimply put, usability is about making products and systems easier and more intuitive to use while matching them more closely to the requirements and needs of their end-users. Usability can be defined by a number of components, but most frequently we define it using the following five attributes:\n\nUser´s satisfaction: how is the user satisfied with the design?\n\nEfficiency: how long does it take for a user to perform tasks in the interface once they are familiar with its design?\n\nMemorability: how easy is for the user to remember the basics of the interface design after not using it for some time?\n\nLearnability: how easy can users do their first simple tasks when they first encounter the interface?\n\nNumber of errors: how many errors do users make, how serious are the errors and how easy it is to recover from these errors?\n\nWhy is usability so important?\n\nBasically, if you want to survive on the Internet, usability is of the essence. If visitors have trouble using your webpage, they will leave. If your homepage is not written clearly enough that your visitors can immediately see the things you are offering, they will leave. If your visitors get lost while browsing your website, they will leave as well.\n\nToday, nobody has the time that they are willing to spend trying to understand your website. Your product or service is far from unique, so instead of trying to learn your website interface, they will simply Google their way out to your competitor´s website. There is one basic and most important law of selling online: If the users cannot find the product, they will not be able to buy it.\n\nHow to improve your usability?\n\nWhile there is a number of ways to test your usability, the most useful is the following approach:\n\nFind some users that have some knowledge of your area of interest\n\n## Ask them to do some tasks on your website\n\nObserve their performance with the goal of identifying weak spots such as areas where they have difficulties using your website.\n\nTypically, a group from 5 to 10 users will be enough to identify the biggest usability issues. You can always give them a couple of different website designs to test and see which performs the best. This approach is always the best due to its cost and time effectiveness.\n\nWhen should you work on your usability?\n\nUsability has an important role in each and every stage of your design process and this is why you should work on testing your usability from the very beginning. Here are some best practices on how to approach this task:\n\nBefore making any new upgrade to the interface, test your current one to identify its good and bad parts.\n\nYou can always test your competitors, as this will give you free information on what to have and what to avoid.\n\nMake multiple prototypes of your new interface and test them thoroughly.\n\nRefine these test results and test them in the process.\n\nOnce you decide on your new interface and implement it, test it again.\n\nStarting your test from the day one is the best way to achieve a high-quality user experience\n\n## Some best practices on improving your website´s usability\n\nKeep your content as concise as possible. Users have very little time and their attention span is very short. Your goal is to get to the point as quickly as possible and cut out all of the unnecessary information. Your words need to be easy to understand, common and short; same as your paragraphs and sentences.\n\nHeadings are your friend. When users look at the website, they do not see it as a whole but as chunks of information. The best strategy to follow their reading style is to break the text by using headings. Headings should be simple and concise with relevant keywords.\n\nHelp them read your website quickly. Make your words count. Visitors tend to read only the first couple of words in headings and articles so make those first words as important as possible.\n\nUse bulleted lists and formatted text. Users tend to give more attention to those parts of content that is written in bulleted lists or formatted in bold. Consider breaking your texts into bulleted lists and use text formatting to highlight important information in bold or italic.\n\nGive your content sufficient spacing. Spacing between letters, words and paragraphs is very important. Test your website´s typography and modify your CSS according to the results of your tests.\n\nUse your images in a smart way. We all know that saying that a picture is worth a thousand words. Make sure all your images are relevant and support your content. Avoid stock photos and irrelevant images."
   },
   {
    "slug": "expert-usability-reviews-user-testing",
    "title": "Expert Usability Reviews v User Testing?",
    "date": "2015-01-07",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-20.jpg",
    "excerpt": "",
    "body": "We are often asked which method is best for my needs, User Testing or Expert Usability Reviews? The simple answer is, it depends on your objectives and available budget.\n\nIf we were thinking of the two side by side, we could expect to get some good results from both. If we were to liken the two to a premier league football team, the expert usability review would be a mid-table workmanlike team, good at what they do, but not title or trophy contenders. Whereas, the User (Usability) Testing study would be a Chelsea, or perhaps Manchester City, a team at the top of their game.\n\nThe main differences between the two are:\n\nUser Testing (or Usability Testing) is primary research that is based on one-to-one interviews with users that match your user persona profiles. They work through a set of scenarios to test specific user journeys and the process is filmed. This is then analysed to identify potential blockers in a website, mobile app or prototype. You’re able to identify nuances and detailed, specific information throughout the test.\n\nExpert Usability Reviews are undertaken by a usability specialist who inspects a website or digital property to identify potential usability issues at a high level. They follow a list of best practice recommendations (perform an heuristic evaluation) to identify design breaches and give you a check-list of actionable insight pointers to make your website easier to use.\n\nUsability Testing is generally more in-depth and will identify some genuine issues that may not have been apparent from an initial Expert Usability Review. Identifying these problems could have a real financial impact on a revenue generating website or mobile application, that could be easily rectified.\n\nCompleting an Expert Usability Review and comparing it to User Testing often identifies that the usability expert may not have identified all of the problems or that elements that you thought were issues were not in fact difficult for users to tackle. No matter how good the expert is in evaluating a website, they are making assumptions based on their knowledge, but not necessarily on the habits of your target user groups and potentially serious issues could be overlooked. They could also lack domain expertise that real users would identify.\n\nThere is some overlap with Expert Usability Reviews and User testing and research by Fu, Salvendy and Turley in 2002 estimated this to be around 41%.\n\nAn Expert Review will generally identify more issues and they are often more commonly performed as they are cheaper and quicker to complete. It may only take a few days to inspect a site, analyze the information write this into a report. Because of this, they’re often preferred to usability testing, especially when time and budget constraints are paramount.\n\nUsability testing requires more time to organize and plan and will be more expensive as you will need to recruit and incentivise users from a specific target audience and this can be costly. It is without doubt worth the effort though, as the results will undoubtedly provide you with a truer picture of problems that your target customers will encounter.\n\nIt is often inconceivable to understand how a modern website can go live without having checked that is genuinely usable. We would liken this to buying a house without looking inside or to continue the football analogy, buying an expensive striker without knowing his form or track record. This is crazy.\n\nA further advantage of usability testing is that conjecture is reduced as you receive powerful and direct user feedback. The video user testing sessions can provide a valuable persuasion tool for reluctant stakeholders that are difficult to dispute.\n\nAn Expert Usability Review can be a good start on the road to improved User Experience Design, but key elements such as the Information Architecture and overall website and navigation should be tested early with real users and refined throughout the build process. There can be no substitute for this face-to-face validation process or the tangible benefits that it accomplishes."
   },
   {
    "slug": "how-to-utilize-customer-journey-mapping-for-communicating-to-stakeholders",
    "title": "How to Utilize Customer Journey Mapping for effectively Communicating with Stakeholders",
    "date": "2014-11-10",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-21.jpg",
    "excerpt": "",
    "body": "We are increasingly being asked by clients to map their existing customer or user journeys and to provide the output information in a usable and visual format so that they can articulate this to their internal stakeholders. This does two things, it firstly enables the stakeholders to fully understand their users’ motivations, attitudes and behaviours at different stages of the engagement cycle. Secondly it can have the effect of more greatly understanding the value of optimising this engagement through wider user experience design.\n\nOur solution for this is a Customer Journey Map shown in the diagram below and in this article we will outline some of the key considerations you should take into account when undertaking the process.\n\n1) Map a current user journey with a customer persona in mind When starting the process, it is important to have a specific customer persona in mind. This will form the basis of your research going forward. You will need to have completed some customer persona research before starting the user journey mapping process so that you are able to understand some of their drivers for purchase. You may have some internal research to help build context to your user persona profiles or you may need to interview a range of your target users one-to-one.\n\n2) Sketch out the main parts of the User or Customer Journey\n\nStart with a pen and paper and sketch out the overarching user journey that the user will take to purchase and post purchase. The purchasing process can broadly be split into the following stages:\n\na) Investigation b) Awareness c) Selection d) Purchase e) Post Purchase.\n\nYou can get creative and we generally start with the way that the customer will arrive at a website.\n\n3) Identify the Information required and likely questions\n\nYou should understand the types of questions users are likely to ask before making a final purchase. These might be related to cost, service and what will happen after a transaction or end point has been reached.\n\nYou might need to shadow users through a process or undertake some additional user research to fully understand the elements of their purchase process and drivers to sale.\n\n4) Analyse the information\n\nOnce you have all of the information together, a useful way of splitting it up into each stage of the process is to log it all in an Excel spreadsheet. This ensures that all the information that you need is in one place and makes it quicker to transfer the information over to a diagram when you are ready. I generally have a different column for each step of the process and then have a different row for what the customer is: ‘Thinking’, ‘Doing’, their ‘Needs/Experience’, ‘Digital Touch Points’ and finally what they are ‘Feeling’.\n\n5) Prepare a Swim Lane Diagram or Customer Journey Map Now that you have all the information planned out, we find that the best way to articulate this is by mapping the information as a Swim Lane Diagram.\n\nYour Customer Journey Mapping will help you articulate the information succinctly and can be used to communicate the users’ attitudes, motivations, behaviours and digital touch points on a single sheet of paper. Although the component elements can sometimes take a while to pull together, the end result makes it easier for key stakeholders to fully understand all of the elements involved in a purchase decision or customer journey."
   },
   {
    "slug": "5-reasons-why-your-ui-designer-should-design-for-users",
    "title": "5 Reasons Why Your UI Designer Should Design for Users",
    "date": "2014-10-22",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-5.jpg",
    "excerpt": "",
    "body": "As a User Interface Designer (UI Designer), we often don’t know what the problem is at the outset of a design project.\n\nTherefore, design is often iterative. We learn based on the available evidence presented from the users. Failing quickly and often enables us to succeed sooner.\n\nWhen designing systems and user interfaces it is paramount that you focus in on the people that will use your product or service. This is important for a number of reasons which I highlight below.\n\n1) Good UI design makes people happy. It gets them excited and ultimately means that they will come back for more. Good user interfaces can have a significant impact on the users’ ability to accomplish things. User interfaces have enabled us to have computers on millions of desks, connect with your family on and offline, share photos and find information.\n\nWhen Apple designed their remote control devices they decided that there was only a small number of essential tasks that needed to be completed. They looked at the established norms and ultimately simplified the key elements down to the minimum number.\n\nGood user interface design is about simplification and ensuring that it performs a small number of tasks well.\n\n2) Bad UI design costs time, money and sometimes lives. Bad User interfaces are annoying. Think of all the time that you waste on day to day tasks that could be avoided through good interface design. Day to day tasks such as trying to establish why your wi-fi isn’t working or using a poor banking website to service your account online. If these frustrations take an average of 10 minutes each day, based on 60 million people in the UK, we could be wasting 600 million man minutes per day or 3.65bn hrs a year on distractions that we could be spending on improving our lives.\n\nThe bad design of medical equipment can cause severe accidents or serious injury. Many of these potential issues can be avoided by following some basic UI design principles. A good UI designer can resolve these issues and remove frustrations.\n\n3) Good User Interface design becomes invisible to us. When an interface becomes second nature, through practice and design, our attention shifts from manipulating an interface to accomplishing a task. Like a blind person using his stick to navigate an obstacle, it becomes an extension of his arm and the senses translated to its tip. That is what happens when a great user interface becomes intuitive.\n\n4) Placing people at the centre of the early UI design process saves time in the long run. Great user interfaces require enormous creativity, design thinking and lots of work. Designing good interfaces can be achieved more simply if you have a tool kit that can guide you through a process following a set of principles. This can be built up over time.\n\n5) The UI Designer can overcome poor design by following a process where they:\n\n1. Let users tasks, goals, and motivations focus development through solid contextual research.\n2. Make decisions based from the perspective of specific user types by developing customer personas.\n3. Work with users throughout the process testing concepts often, with a robust feedback mechanism.\n4. Pay attention to the problem at hand and people’s abilities.\n5. Talk to the actual experts that use the product or service on a daily basis and the other stakeholders.\n\nBy following some of these principles, we will develop wonderfully designed products and services that will save us time, frustration and enhance our lives."
   },
   {
    "slug": "developing-customer-personas-is-the-key-to-a-successful-user-experience",
    "title": "Developing Customer Personas: The Key to a Successful User Experience",
    "date": "2014-09-20",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-22.jpg",
    "excerpt": "",
    "body": "What is a Persona?\n\nCustomer Persona Development is a term used in User Experience design whereby users are transformed from numbers to people through context. By looking at the professions, ages, and other demographics of website users, we can delve into the different types of people and investigate scenarios of when they use a particular website.\n\nWhy Use Them?\n\nIn market research, the information usually obtained is “48% of users purchased a subscription in November 2013”. What quantitative research lacks is the ability to understand users’ motivations behind why they have decided to purchase a subscription, but more importantly why the remaining 52% did not go ahead and purchase a subscription. By generating User Personas we look beyond the statistics, we delve into the behaviours of specific users, we think about their attitudes, how technology savvy they are, whether they use social media, and most importantly their goals and motivations of using the website. In this example, market research adequately concludes that 52% of users are not completing their subscription purchase, but by finding out why just one person dropped out the process, we might be able to decrease this 52% to a much smaller number, as other users may have shared a similar experience. By improving the user journey, we can help increase conversion rates.\n\nCosts and Benefits.\n\nThe hardest thing about creating personas is convincing clients who are unfamiliar and perhaps sceptical about the exercise. The most effective personas are made when there is a positive interaction between the UX expert and the client; the UX professional brings in their expertise, while the client brings vital knowledge. Although the client may not know that much about their customers (you’d be surprised how little companies know about their users), they know certain demographics e.g. ages, professions. Through developing personas you beginto build an image in your head of who these users are, giving them a name helps translate them from just a statistic into an actual person. At first clients may not understand the point of the exercise, however, 99% of the time they will leave the persona workshop feeling like they learnt a lot about their users. Once you’ve succeeded this initial bump you can reap the benefits. Creating effective personas is the springboard to achieving the goal at the end of the process. Why? Because we can develop a prototype with the user firmly in mind. Firstly think about “Sam” and the journey he might take to purchase an Xbox on eBay, you then see the barriers and problems he may face and later develop a prototype which hopes to improve this journey for Sam. During the development of the prototype you can then refer back to your personas; you can recruit someone who fits “Sam” and see how he finds the original user journey compared to the new prototype journey.\n\nCreating Customer Personas ensures the designer is developing a website/product with the user in mind. Generating personas is a quick, cheap, and effective task, and is one of the most important elements in the UX design process."
   },
   {
    "slug": "10-things-your-ux-design-agency-should-know-about-people",
    "title": "10 Things Your UX Design Agency Should Know About People",
    "date": "2014-08-16",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-4.jpg",
    "excerpt": "",
    "body": "At the end of last year I went to the very interesting UX Brighton conference. This looks at various facets of the psychology of user experience (UX) design and acts as an excellent refresher to some of the information that I’ve gathered over many years of working in the field.\n\nOne of the speakers was Susan Weinschenk, author of 100 things every designer should know about people. This article is a top 10 summary of the ten things every user experience design agency should know about people when considering their UX designs.\n\n10) What you see isn’t what your brain gets.\n\nWhen you walk around, you assume that your eyes are sending information to the brain which gives you a realistic experience of the what is there. The brain is in-fact constantly interpreting everything you see and filling in any gaps with what it expects to see based on experience.\n\n9) The Fusiform Face Area (FFA) influences the interpretation of emotion in the face.\n\nThe FFA captures attention, and stimulates emotional appeal. By looking at this area, you can tell if someone is happy, sad, angry or relaxed and using people’s faces can play a significant part in the design of web pages and adverts. People with the condition Autism aren’t able to recognize the FFA connection and as a result can’t identify the subtleties of facial emotion.\n\n8) Users have ‘Inattention blindness’.\n\nUsers can often miss colour and other changes on a page even if they are in our field of vision.\n\n7) People use their peripheral vision to get the gist of a situation.\n\nFood, Sex, Movement and stories get the most attention but an indication of danger is processed more quickly than anything else. It is identified unconsciously and grabs your attention. There are 40 billion sensory inputs entering the brain every second and you’re aware of around 40. Much of what happens takes place unconsciously.  This brings into question the validity of Eye Tracking tools as they are not measuring peripheral vision at all. Just because a user is looking at something, it doesn’t mean they are paying attention to it.\n\n6) Speaker and listener brains synch up during communication.\n\nWhen you listen to someone talking, your brain starts working in synch with the speaker. In his research, Greg Stephens (2010) noted that the part of the brainto do with social interaction and information also synched and these are crucial for successful communication, such as the ability to discern the beliefs, desires and goals of others.  As a result, presenting information through audio and/or video where they can hear someone talking is particularly powerful to help people understand the message. Don’t just rely on reading if you want people to understand your information clearly.\n\n5) People operate in system 1 and system 2 thinking modes.\n\nSystem 2 thinking requires effort. System 1 thinking is easy. We need to remove any barriers to a user’s experience to ensure that they remain in system 1 mode to prevent difficulties. Daniel Kahneman also identified that when in system 2 thinking mode your pupils dilate, so this is easy to observe. You can test this out by asking someone a series of simple questions versus something more difficult to understand. Something as simple as font changes can affect your system of thinking.\n\n4) When something is hard to read, it is hard to do.\n\nPages should be easy to read as when something is hard to read it triggers your system 1 thinking. This will clearly have an impact on how we should design pages.\n\n3) Users have a series of conditioned responses to specific stimulus.\n\nThe chemical Dopamine is information seeking and is triggered when we get information that we recognize. Over the development of the Internet, we’ve used auditory or visual cues to create responses or habits. An example of this could be when you roll-over a link and it turns blue and is underlined to indicate it is a link. Ivan Pavlov highlights how we can become conditioned in his experiment with a dog salivating when ringing a bell at feeding times in anticipation of receiving his food. Diverging too significantly from users conditioned responses will have a detrimental effect on how customers will use a website.\n\n2) People prefer objects with curves.\n\nThis might explain why the Apple iPhone is a best seller, whereas some other models of mobile phone are less well received.\n\n1) Vision and hearing can’t be separated from our social and emotional processing.\n\nWhen people perform or play together oxytocin is released and people bond and their heart beats and other functions go into synch. When designing and making decisions, we need to understand that users bring all elements to bare, including the environment in which they are viewing a particular digital experience.\n\nConclusion.\n\nWhen undertaking User Experience Design and its effect on people there are clearly many facets to consider and I hope this provides a starting point for your investigations. We’ll try and cover off some other interesting thoughts in later articles."
   },
   {
    "slug": "the-best-ux-prototyping-tools",
    "title": "The Best UX & UI Prototyping Tools",
    "date": "2014-01-10",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-23.jpg",
    "excerpt": "",
    "body": "Identification of the best UX/UI prototyping tools are discussed on which ever UX forum you go to. When we are asked, we come up with the same response. It depends.\n\nYour prototyping tool of choice will need to take into consideration a number of aspects, such as your needs, the client’s requirements as well as your other stakeholders.\n\nEverybody from CEO to developer will need to answer different questions or may see some of the elements of the project from a different perspective. If you are just trying to explainto the developer, who sits by your side what you need, then a quick paper sketch should be good enough.\n\nHowever, if the developers are based in another country or you want to impress stakeholders, then you need a prototype with higher fidelity prototyping tools.\n\nHere at Channel Dynamics we use Axure a lot, because it better suits our needs and enables us to represent a user interface at a high fidelity. It is slightly more complicated, as it allows you to create advanced interactions. The support and community forum are always very helpful and friendly too. With Axure we can create websites and apps that do not look too different from the final version.\n\nIf you are still trying to work out your tool of preference, the best way to discover is through experimentation. When the time comes, you will know what is the most suitable for your needs.\n\nBelow is a summary of some of the best UX/UI Design Prototyping tools.\n\nAxure RP – If you have a bit more time in your hands and want to impress, that is your choice. It could be a little daunting at the beginning, but the support and forum never fail. You can create prototypes with such a good level of detail that it almost looks like the real thing. It is a little bit pricey, though, compared to the other options.\n\nBalsamiq – If someone that is not a ‘creative’, is far away and cannot express their idea visually, just tell them to go to balsamiq.com. Anyone can use Balsamiq. Good if you are looking for something simple and straight to the point.\n\nOmnigraffle – Great tool to create beautiful task flows and maps for presentations or simply a good-looking Information Architecture (IA) output. The wireframe stencils also make it ridiculously easy for anyone to show their ideas and it is not too expensive.\n\nPaper – Quick and dirty. There are no excuses for not making yourself understood. Sketch everything, you can even test it, and then it is the developer’s problem. It is very cheap, but it could become a mess"
   },
   {
    "slug": "flat-design-user-experience",
    "title": "Flat Design for User Experience",
    "date": "2014-01-05",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-5.jpg",
    "excerpt": "",
    "body": "One of the first things I learned in Interactive Media was that I should design thinking of metaphors so users could understand immediately the use of a digital tool. For instance, in the “desktop”, the tool to get rid of unwanted “files” looks exactly as the bin. It is not a real bin that you can accidentally touch dodgy sticky things. It is a virtual representation. However, if this virtual bin looked like a triangle, it would’ve been much harder to explain the new users that dragging and dropping something onto the triangle it would make the object disappear. Now, imagine that every element of the desktop was a shape instead of a real object. It looks like a mess, doesn’t it? What is the circle? What is the square? And they are all floating in 3D! Think of all the possibilities.\n\nFurthermore, if this metaphor is not used properly, it can make the users even more confused. For instance, a button affords to be pushed and trigger some interaction. A person wouldn’t spin a pushable button, so don’t create an interaction with a spinnable button. No one will understand and consequently feel frustrated.\n\nMoreover, a kid nowadays wouldn’t understand why it is necessary to click on a floppy disc to save something. They have never used a floppy disk. Do they know what it is at all? Thinking of icons is not as easy as it looks.\n\nThis formula has worked very well for the past 20 years more or less. So much so, a design philosophy dominated the UI design field fuelled by Apple’s success: skeuomorphism. That is the extreme copy of a real object: the more real it looks, the better. Virtual calendars have leather texture and bits of ripped paper. The button looks so real, it shines when it is tilted.\n\nHowever, UI designers got tired of it and they started to question if users still needed these clues. They wanted to have the freedom to abstract. That is when flat design got strength. It is almost a complete negation of skeuomorphism, as most trends are an antithesis of the previous one. Of course, metaphors and affordances are still best practice, but they are not taken to the extreme. Minimalism with blocks of colours and beautiful typography seems to be the new norm."
   },
   {
    "slug": "the-main-benefits-of-user-centred-design",
    "title": "The main benefits of user centred design",
    "date": "2013-11-03",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-6.jpg",
    "excerpt": "",
    "body": "We are often asked by clients what are the benefits of employing user-centred design for our projects, so find below a summary of my main answers.\n\n## Benefits of User Centred design\n\n1) You produce better products – They work for their intended purpose and are validated by users and in line with commercial objectives.\n\n2) Cheaper to fix problems – By involving users, you learn what doesn’t work when it’s cost effective to fix it.\n\n3) Less Risk – identify issues before the product is built and launched and lower the risk of failure.\n\n4) Deliver the project to deadline – avoid scope creep by identifying the main dynamics at play and their associated challenges.\n\n5) Research brings insights – and uncovers opportunity to gain competitive advantages based on evidence, not opinions\n\n6) Products that are easy to use make more money – and they should be aligned with both the user and commercial objectives.\n\n7) User led projects get product to market more quickly – customers decide which route to follow, circumventing internal politics.\n\n8) Ease of use is a common customer requirement – and customers expect this now.\n\nI read the other day that 15% of digital projects are abandoned, developers spend 50% of their time on avoidable re-work and the cost to fix a problem ends up costing about 100 times more than it would have done by getting it right in the first place.\n\nThree of the top 10 reasons for project failure are badly defined requirements, poor communications between clients, developers and users and stakeholder politics. These are all avoidable evils that we can fix through good user centred design and following a solid user experience process for new projects."
   },
   {
    "slug": "government-seis-scheme-is-great-news-for-our-investors",
    "title": "5 reasons why the Government’s SEIS Scheme is great news for Investors",
    "date": "2013-10-20",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-24.jpg",
    "excerpt": "",
    "body": "There is a great new scheme in town and it’s called the Seed Enterprise Investment Scheme (SEIS). The changes were announced in the Chancellor’s Autumn statement and this is especially interesting if you’re a high rate tax payer, because from April 6th 2012 there are some fantastic tax breaks available.\n\nAt Channel Dynamics, we’re always interested in hearing from investors of various sizes, whether they be VCs or Angels. We get investors involved early, as part of our business development process, let them familiarise themselves with the management team and follow the build and delivery cycle through to fruition. This means that we can get investment as the new businesses are ready, rather than starting another lengthy pitch cycle and put projects on hold while the money has been raised.\n\nThe normal target investments for round one are seed funds, ranging from £150k-£450k. At the low end of this target range, investors are eligible to invest under the Government’s SEIS scheme. This is particularly interesting for higher rate tax payers for five reasons:\n\n1) 50% Tax relief: Investors can receive a 50% tax relief in the tax year the investment is made, regardless of their marginal rate, provided they will own less than 30% of the company. There is an investment limit of £100k in any tax year.\n\n2) Capital gains exemption: In the 2012-13 tax year, tax payers can roll any chargeable gain in the tax year into a SEIS with a full capital gains tax exemption.\n\n3) Tax free gains: Provided the investment is retained in the company for 3 years, any gain or profit on the original investment will be 100% tax free.\n\n4) Large potential gains: As the SEIS scheme is designed for startup companies, any gain has the potential to be large as investors are getting in on the ground level.\n\n5) Relatively Low risk: The SEIS investments are very low risk. The potential downside as a high rate tax payer is only 25% of your original investment and could be even lower under some circumstances.\n\nSo, some great news for investors with this scheme making the investment conditions unprecedented in the market and should prove to be a new stimulus for startup businesses in the UK."
   }

<meta property="og:site_name" content="${attr(S.name)}">
${ogImg ? `<meta property="og:image" content="${attr(S.url.replace(/\/$/,'')+ogImg)}">` : ''}
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="${attr(S.favicon)}" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=${T.font.replace(/ /g,'+')}:wght@400;500;600;700;800&display=swap" rel="stylesheet">
${ld}
<style>${css(T)}</style>
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="logo" href="/"><img src="${attr(S.logo)}" alt="${attr(S.name)} logo" width="40" height="40">${esc(S.name)}</a>
  <button class="burger" aria-label="Menu" aria-expanded="false" onclick="var n=document.getElementById('nav');n.classList.toggle('open');this.setAttribute('aria-expanded',n.classList.contains('open'))"><span></span></button>
  <ul class="nav" id="nav">${navHtml}</ul>
</div></header>
<main>
${page.body}
</main>
<footer class="site-footer"><div class="wrap">
  <div class="cols">
    <div>
      <a class="logo" href="/"><img src="${attr(S.logo)}" alt="" width="40" height="40">${esc(S.name)}</a>
      <p>${esc(F.tagline)}</p>
      <p style="margin-top:14px"><a href="mailto:${attr(S.email)}">${esc(S.email)}</a><br>${S.phone?`<a href="tel:${attr(S.phone.replace(/\s+/g,''))}">${esc(S.phone)}</a>`:''}</p>
    </div>
    <div><h4>${esc(F.servicesHeading)}</h4><ul>${(F.links||[]).map(l=>`<li><a href="${attr(l.href)}">${esc(l.label)}</a></li>`).join('')}</ul></div>
    <div><h4>${esc(F.companyHeading||'Company')}</h4><ul>${(F.companyLinks||[]).map(l=>`<li><a href="${attr(l.href)}">${esc(l.label)}</a></li>`).join('')}</ul></div>
    <div>
      <h4>${esc(F.membershipsHeading)}</h4>
      <div class="badges">${(F.memberships||[]).map(m=>`<a href="${attr(m.href||'#')}" target="_blank" rel="noopener"><img src="${attr(m.image)}" alt="${attr(m.name)}" loading="lazy"></a>`).join('')}</div>
      ${(F.partners&&F.partners.length)?`<h4 style="margin-top:22px">${esc(F.partnersHeading)}</h4><div class="badges">${F.partners.map(m=>`<img src="${attr(m.image)}" alt="${attr(m.name)}" loading="lazy">`).join('')}</div>`:''}
    </div>
  </div>
  <div class="legal"><span>${esc(F.copyright)}</span><span><a href="/terms/">Terms &amp; conditions</a></span></div>
</div></footer>
</body>
</html>`;
  }

  /* ---------- shared blocks ---------- */
  const ctaBand = (c, h, t, label, href) => `<section class="cta-band"><div class="wrap"><div><h2>${esc(h)}</h2>${t?`<p>${esc(t)}</p>`:''}</div><a class="btn light" href="${attr(href||c.navCta.href)}">${esc(label||c.navCta.label)}</a></div></section>`;
  const hero = (o) => `<section class="hero${o.compact?' compact':''}${o.plain?' plain':''}" style="--hero-img:url('${attr(o.image||'')}')"><div class="wrap">
      ${o.eyebrow?`<div class="eyebrow">${esc(o.eyebrow)}</div>`:''}
      ${o.kicker?`<div class="kicker">${esc(o.kicker)}</div>`:''}
      <h1>${esc(o.title)}</h1>
      ${o.text?`<p class="lead">${inline(o.text)}</p>`:''}
      ${(o.ctaLabel||o.cta2Label)?`<div class="actions">${o.ctaLabel?`<a class="btn" href="${attr(o.ctaHref)}">${esc(o.ctaLabel)}</a>`:''}${o.cta2Label?`<a class="btn outline-light" href="${attr(o.cta2Href)}">${esc(o.cta2Label)}</a>`:''}</div>`:''}
    </div></section>`;
  const workCard = (cs) => `<a class="work-card" href="/work/${attr(cs.slug)}/"><img src="${attr(cs.thumb||cs.heroImage)}" alt="${attr(cs.client)}" loading="lazy"><div class="body">${cs.stat?`<div class="stat">${esc(cs.stat)}</div>`:''}<h3>${esc(cs.client)}</h3><p>${esc(cs.stat?cs.statLabel:cs.headline)}</p></div></a>`;
  const workGrid = (list) => `<div class="grid-3">${list.map(workCard).join('')}</div>`;
  const postCard = (p) => `<article class="card"><img src="${attr(p.hero)}" alt="" loading="lazy"><div class="body"><span class="tag">${fmtDate(p.date)}</span><h3>${esc(p.title)}</h3><p>${esc(trunc(p.excerpt||p.body,140))}</p><span class="arrow-link">Read article</span></div><a class="cover" href="/blog/${attr(p.slug)}/" aria-label="${attr(p.title)}"></a></article>`;
  const logoWall = (list, cls='logo-wall') => `<div class="${cls}">${list.map(l=>`<div><img src="${attr(l.image||l)}" alt="${attr(l.name||'')}" loading="lazy"></div>`).join('')}</div>`;
  const quoteCard = (t) => `<div class="quote-card"><blockquote>${esc(t.quote)}</blockquote><div class="who">${t.image?`<img src="${attr(t.image)}" alt="${attr(t.name)}" loading="lazy">`:''}<div><b>${esc(t.name)}</b><span>${esc([t.role,t.company].filter(Boolean).join(', '))}</span></div></div></div>`;
  const pullQuote = (q, who) => q ? `<div class="pull-quote"><blockquote>“${esc(q)}”</blockquote>${who?`<cite>— ${esc(who)}</cite>`:''}</div>` : '';
  const crumbs = (items) => `<nav class="breadcrumb" aria-label="Breadcrumb">${items.map((i,n)=> n<items.length-1 ? `<a href="${attr(i.href)}">${esc(i.label)}</a> / ` : `<span>${esc(i.label)}</span>`).join('')}</nav>`;
  const breadcrumbLd = (c, items) => ({"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":items.map((i,n)=>({"@type":"ListItem","position":n+1,"name":i.label,"item":c.site.url.replace(/\/$/,'')+i.href}))});

  /* ---------- pages ---------- */
  function homePage(c){
    const H=c.home, byslug=Object.fromEntries(c.work.caseStudies.map(x=>[x.slug,x]));
    const featured=(H.featuredWork||[]).map(s=>byslug[s]).filter(Boolean);
    const posts=[...c.blog.posts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,H.blogCount||4);
    const body = `
${hero({...H.hero})}
${H.stats&&H.stats.length?`<div class="stats"><div class="wrap"><div class="grid">${H.stats.map(s=>`<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div></div></div>`:''}
<section><div class="wrap">
  <div class="section-head"><div class="eyebrow">${esc(H.audiencesEyebrow)}</div><h2>${esc(H.audiencesHeading)}</h2>${H.audiencesText?`<p>${esc(H.audiencesText)}</p>`:''}</div>
  <div class="grid-3">${H.audiences.map(a=>`<article class="card"><img src="${attr(a.image)}" alt="" loading="lazy"><div class="body"><span class="tag">${esc(a.title)}</span><h3>${esc(a.text)}</h3><span class="arrow-link">${esc(a.linkLabel||'Learn more')}</span></div><a class="cover" href="${attr(a.href)}" aria-label="${attr(a.title)}"></a></article>`).join('')}</div>
</div></section>
<section class="bg-mist"><div class="wrap">
  <div class="section-head center"><div class="eyebrow">${esc(H.clientsEyebrow)}</div><h2>${esc(H.clientsHeading)}</h2>${H.clientsText?`<p>${esc(H.clientsText)}</p>`:''}</div>
  ${logoWall(c.clients)}
</div></section>
<section><div class="wrap">
  <div class="section-head"><div class="eyebrow">${esc(H.workEyebrow)}</div><h2>${esc(H.workHeading)}</h2>${H.workText?`<p>${esc(H.workText)}</p>`:''}</div>
  ${workGrid(featured)}
  <p style="margin-top:30px"><a class="btn ghost" href="/work/">See all case studies</a></p>
</div></section>
<section class="bg-mist"><div class="wrap">
  <div class="section-head center"><div class="eyebrow">${esc(H.testimonialsEyebrow)}</div><h2>${esc(H.testimonialsHeading)}</h2></div>
  <div class="grid-3">${H.testimonials.map(quoteCard).join('')}</div>
</div></section>
<section><div class="wrap">
  <div class="section-head"><div class="eyebrow">${esc(H.blogEyebrow)}</div><h2>${esc(H.blogHeading)}</h2>${H.blogText?`<p>${esc(H.blogText)}</p>`:''}</div>
  <div class="grid-4">${posts.map(postCard).join('')}</div>
</div></section>
${ctaBand(c, H.cta.heading, H.cta.text, H.cta.label, H.cta.href)}`;
    const jsonld = {"@context":"https://schema.org","@type":"ProfessionalService","name":c.site.name,"legalName":c.site.legalName,"url":c.site.url,"logo":c.site.url.replace(/\/$/,'')+c.site.logo,"email":c.site.email,"telephone":c.site.phone,"description":c.seo.defaultDescription,"address":{"@type":"PostalAddress","streetAddress":c.site.addressLine1,"addressLocality":c.site.addressCity,"postalCode":c.site.addressPostcode,"addressCountry":"GB"},"areaServed":"GB","sameAs":(c.site.sameAs||[]).filter(Boolean)};
    return {path:'/', title:'', description:c.seo.defaultDescription, body, jsonld, image:H.hero.image};
  }

  function workIndex(c){
    const W=c.work;
    const body = `${hero({title:W.title,text:W.intro,image:W.heroImage,eyebrow:W.eyebrow,compact:true})}
<section><div class="wrap">${workGrid(W.caseStudies)}</div></section>
${ctaBand(c, W.ctaHeading, W.ctaText)}`;
    return {path:'/work/', title:W.title, description:plain(W.intro), body, image:W.heroImage};
  }

  function caseStudyPage(c, cs){
    const others=c.work.caseStudies.filter(x=>x.slug!==cs.slug).slice(0,3);
    const sec=(n,h,ps,imgs,extra='')=> (ps&&ps.length||extra) ? `<div class="cs-section"><h2><span class="n">${n}</span>${esc(h)}</h2>${paras(ps)}${extra}${imgs&&imgs.length?`<div class="cs-imgs${imgs.length>1?' two':''}">${imgs.map(i=>`<img src="${attr(i)}" alt="${attr(cs.client)} project image" loading="lazy">`).join('')}</div>`:''}</div>` : '';
    const objectives = cs.objectives&&cs.objectives.length ? `<p><strong>The main objectives were to:</strong></p><ul class="check-list">${cs.objectives.map(o=>`<li>${inline(o)}</li>`).join('')}</ul>` : '';
    const crumbItems=[{label:'Home',href:'/'},{label:'Work',href:'/work/'},{label:cs.client,href:`/work/${cs.slug}/`}];
    const body = `${hero({kicker:cs.client, title:cs.headline, text:cs.summary, image:cs.heroImage, compact:true})}
<section><div class="wrap">
  ${crumbs(crumbItems)}
  <div class="cs-layout">
    <div>
      ${sec(1,'The client',cs.clientParas)}
      ${sec(2,'The challenge',cs.challengeParas,null,objectives)}
      ${sec(3,'Our approach',cs.approachParas,cs.approachImages)}
      ${pullQuote(cs.quote, cs.quoteWho)}
      ${sec(4,'The results',cs.resultParas,cs.resultImages)}
    </div>
    <aside class="cs-aside">
      ${cs.logo?`<img src="${attr(cs.logo)}" alt="${attr(cs.client)} logo">`:''}
      <h4>At a glance</h4>
      <dl>
        <div><dt>Client</dt><dd>${esc(cs.client)}</dd></div>
        ${cs.stat?`<div><dt>Result</dt><dd>${esc(cs.stat)} ${esc(cs.statLabel)}</dd></div>`:''}
        ${cs.services&&cs.services.length?`<div><dt>What we did</dt><dd>${cs.services.map(s=>esc(s)).join('<br>')}</dd></div>`:''}
      </dl>
      <p style="margin-top:22px"><a class="btn" href="${attr(c.navCta.href)}" style="width:100%;justify-content:center">${esc(c.navCta.label)}</a></p>
    </aside>
  </div>
</div></section>
<section class="bg-mist"><div class="wrap"><div class="section-head"><h2>More case studies</h2></div>${workGrid(others)}</div></section>`;
    const jsonld = breadcrumbLd(c, crumbItems);
    return {path:`/work/${cs.slug}/`, title:`${cs.client} — ${cs.headline}`, description:plain(cs.summary||cs.clientParas[0]||''), body, jsonld, image:cs.heroImage};
  }

  function servicesIndex(c){
    const S=c.services;
    const pageBy=Object.fromEntries(S.pages.map(p=>[p.slug,p]));
    const body=`${hero({title:S.title,text:S.intro,image:S.heroImage,eyebrow:S.eyebrow,compact:true})}
<section><div class="wrap"><div style="display:grid;gap:22px">
${S.pillars.map(p=>`<div class="pillar"><img src="${attr(p.icon)}" alt=""><div><h3><a href="/services/${attr(p.slug)}/" style="color:inherit">${esc(p.name)}</a></h3><p>${esc(p.text)}</p><ul>${(p.items||[]).map(s=>pageBy[s]?`<li><a href="/services/${attr(p.slug)}/${attr(s)}/">${esc(pageBy[s].name||pageBy[s].title)}</a></li>`:'').join('')}</ul><a class="arrow-link" href="/services/${attr(p.slug)}/">${esc(p.linkLabel||('More about '+p.name))}</a></div></div>`).join('')}
</div></div></section>
${S.extras&&S.extras.length?`<section class="bg-mist"><div class="wrap"><div class="section-head"><h2>${esc(S.extrasHeading)}</h2></div><div class="grid-3">${S.extras.map(e=>`<article class="card"><div class="body"><h3>${esc(e.name)}</h3><p>${esc(e.text)}</p><span class="arrow-link">Find out more</span></div><a class="cover" href="${attr(e.href)}" aria-label="${attr(e.name)}"></a></article>`).join('')}</div></div></section>`:''}
<section><div class="wrap"><div class="section-head center"><h2>${esc(S.clientsHeading)}</h2></div>${logoWall(c.clients)}</div></section>
${ctaBand(c, S.ctaHeading, S.ctaText)}`;
    return {path:'/services/', title:S.title, description:plain(S.intro), body, image:S.heroImage};
  }

  function pillarPage(c, p){
    const S=c.services, pageBy=Object.fromEntries(S.pages.map(x=>[x.slug,x]));
    const items=(p.items||[]).map(s=>pageBy[s]).filter(Boolean);
    const crumbItems=[{label:'Home',href:'/'},{label:'Services',href:'/services/'},{label:p.name,href:`/services/${p.slug}/`}];
    const body=`${hero({title:p.name,text:p.longText||p.text,image:p.heroImage||S.heroImage,eyebrow:'Services',compact:true})}
<section><div class="wrap">${crumbs(crumbItems)}
<div class="grid-3">${items.map(s=>`<article class="card"><div class="body"><span class="tag">${esc(p.name)}</span><h3>${esc(s.name||s.title)}</h3><p>${esc(trunc(s.intro[0]||'',150))}</p><span class="arrow-link">Find out more</span></div><a class="cover" href="/services/${attr(p.slug)}/${attr(s.slug)}/" aria-label="${attr(s.title)}"></a></article>`).join('')}</div>
</div></section>
${ctaBand(c, S.ctaHeading, S.ctaText)}`;
    return {path:`/services/${p.slug}/`, title:`${p.name} services`, description:plain(p.longText||p.text), body, jsonld:breadcrumbLd(c,crumbItems), image:p.heroImage||S.heroImage};
  }

  function servicePage(c, s){
    const S=c.services;
    const pillar=S.pillars.find(p=>p.slug===s.parent);
    const path = pillar ? `/services/${pillar.slug}/${s.slug}/` : `/services/${s.slug}/`;
    const crumbItems=[{label:'Home',href:'/'},{label:'Services',href:'/services/'}].concat(pillar?[{label:pillar.name,href:`/services/${pillar.slug}/`}]:[]).concat([{label:s.name||s.title,href:path}]);
    let flip=false;
    const sections=(s.sections||[]).map(sec=>{
      const hasText = (sec.paras&&sec.paras.length)||(sec.bullets&&sec.bullets.length);
      const imgs=(sec.images||[]).filter(Boolean);
      const text=`<div>${sec.heading?`<h2>${esc(sec.heading)}</h2>`:''}${paras(sec.paras)}${sec.bullets&&sec.bullets.length?`<ul class="check-list${sec.bullets.length>4&&!imgs.length?' cols':''}">${sec.bullets.map(b=>`<li>${inline(b)}</li>`).join('')}</ul>`:''}</div>`;
      if(imgs.length===1 && hasText){ flip=!flip; return `<div class="svc-section"><div class="split${flip?' rev':''}">${text}<div><img src="${attr(imgs[0])}" alt="${attr(sec.heading||s.title)}" loading="lazy"></div></div></div>`; }
      return `<div class="svc-section">${hasText?text:''}${imgs.length?`<div class="svc-imgs">${imgs.map(i=>`<img src="${attr(i)}" alt="${attr(sec.heading||s.title)}" loading="lazy">`).join('')}</div>`:''}</div>`;
    }).join('');
    const body=`${hero({title:s.title,text:(s.intro||[])[0],image:s.heroImage||(pillar&&pillar.heroImage)||S.heroImage,eyebrow:pillar?pillar.name:'Services',compact:true,ctaLabel:s.ctaLabel||c.navCta.label,ctaHref:c.navCta.href})}
<section><div class="wrap">${crumbs(crumbItems)}
${(s.intro||[]).length>1?`<div class="prose" style="margin-bottom:50px">${paras(s.intro.slice(1))}</div>`:''}
<div class="svc-sections">${sections}</div>
</div></section>
${s.clientLogos&&s.clientLogos.length?`<section class="bg-mist"><div class="wrap"><div class="section-head"><h2>${esc(s.clientsHeading||'Just a few of the clients we have helped')}</h2></div>${logoWall(s.clientLogos,'logo-row')}${pullQuote(s.quote,s.quoteWho)}</div></section>`:(s.quote?`<section class="bg-mist"><div class="wrap">${pullQuote(s.quote,s.quoteWho)}</div></section>`:'')}
${ctaBand(c, s.ctaHeading||S.ctaHeading, s.ctaText||S.ctaText)}`;
    return {path, title:s.title, description:plain((s.intro||[])[0]||''), body, jsonld:breadcrumbLd(c,crumbItems), image:s.heroImage||S.heroImage};
  }

  function sellingPage(c){
    const P=c.selling;
    const body=`${hero({title:P.title,text:P.intro,image:P.heroImage,eyebrow:P.eyebrow,ctaLabel:c.navCta.label,ctaHref:c.navCta.href})}
<section><div class="wrap"><div class="section-head"><h2>${esc(P.heading)}</h2></div><div class="prose">${paras(P.body)}</div>
<div class="compare" style="margin-top:40px"><div class="old"><h3>${esc(P.oldHeading)}</h3><ul>${lines(P.oldWay).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="new"><h3>${esc(P.newHeading)}</h3><ul>${lines(P.newWay).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
<div class="prose" style="margin-top:40px">${paras(P.body2)}</div></div></section>
<section class="bg-mist"><div class="wrap"><div class="section-head"><h2>${esc(P.stepsHeading)}</h2></div><div class="steps">${P.steps.map((s,i)=>`<div class="step">${s.image?`<img src="${attr(s.image)}" alt="" loading="lazy">`:''}<div class="num">Step ${i+1}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('')}</div></div></section>
<section><div class="wrap"><div class="section-head center"><h2>${esc(c.home.testimonialsHeading)}</h2></div><div class="grid-3">${c.home.testimonials.map(quoteCard).join('')}</div></div></section>
${ctaBand(c, P.ctaHeading, P.ctaText)}`;
    return {path:'/services/predictable-selling-systems/', title:P.title, description:plain(P.intro), body, image:P.heroImage};
  }

  function trainingPage(c){
    const T=c.training;
    const body=`${hero({title:T.title,text:T.intro,image:T.heroImage,eyebrow:T.eyebrow,compact:true,ctaLabel:T.ctaLabel,ctaHref:T.ctaHref})}
<section><div class="wrap"><div class="section-head"><h2>${esc(T.coursesHeading)}</h2><p>${esc(T.coursesText)}</p></div>
<div class="grid-3">${T.courses.map(k=>`<div class="course">${k.image?`<img src="${attr(k.image)}" alt="" loading="lazy">`:''}<h3>${esc(k.name)}</h3>${k.price?`<div class="price">${esc(k.price)}</div>`:''}<p>${esc(k.text)}</p></div>`).join('')}</div></div></section>
<section class="bg-mist"><div class="wrap"><div class="section-head"><h2>${esc(T.clientsHeading)}</h2></div>${logoWall(T.clientLogos,'logo-row')}</div></section>
<section><div class="wrap"><div class="section-head"><h2>${esc(T.testimonialsHeading)}</h2></div><div class="grid-3">${T.testimonials.map(t=>`<div class="quote-card"><blockquote>${esc(t.quote)}</blockquote><div class="who"><div><b>${esc(t.who)}</b></div></div></div>`).join('')}</div></div></section>
<section class="bg-mist"><div class="wrap narrow"><div class="section-head"><h2>${esc(T.faqHeading)}</h2></div>${T.faqs.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}</div></section>
${ctaBand(c, T.ctaHeading, T.ctaText, T.ctaLabel, T.ctaHref)}`;
    const jsonld={"@context":"https://schema.org","@type":"FAQPage","mainEntity":T.faqs.map(f=>({"@type":"Question","name":f.q,"acceptedAnswer":{"@type":"Answer","text":f.a}}))};
    return {path:'/training/', title:T.title, description:plain(T.intro), body, jsonld, image:T.heroImage};
  }

  function aboutPage(c){
    const A=c.about; let flip=true;
    const sections=A.sections.map(s=>{ flip=!flip; const img=s.image?`<div><img src="${attr(s.image)}" alt="${attr(s.heading)}" loading="lazy"></div>`:''; return `<div class="svc-section"><div class="split${flip?' rev':''}"><div><h2>${esc(s.heading)}</h2>${paras(s.paras)}${s.linkLabel?`<p><a class="arrow-link" href="${attr(s.linkHref)}">${esc(s.linkLabel)}</a></p>`:''}</div>${img}</div></div>`; }).join('');
    const body=`${hero({title:A.title,text:A.intro,image:A.heroImage,eyebrow:A.eyebrow,compact:true})}
<section><div class="wrap"><div class="svc-sections">${sections}</div></div></section>
<section class="bg-mist"><div class="wrap">${pullQuote(A.quote,A.quoteWho)}<div class="section-head center" style="margin-top:50px"><h2>${esc(A.clientsHeading)}</h2></div>${logoWall(c.clients)}</div></section>
${ctaBand(c, A.ctaHeading, A.ctaText)}`;
    return {path:'/about/', title:A.title, description:plain(A.intro), body, image:A.heroImage};
  }

  function resourcesPage(c){
    const R=c.resources;
    const body=`${hero({title:R.title,text:R.intro,eyebrow:R.eyebrow,compact:true,plain:true})}
<section><div class="wrap"><div class="grid-2">${R.items.map(r=>`<div class="resource">${r.image?`<img src="${attr(r.image)}" alt="" loading="lazy">`:''}<div><h3>${esc(r.title)}</h3><p style="color:var(--slate);margin:8px 0 14px">${esc(r.text)}</p><a class="btn ghost" href="${attr(r.file)}" download>${esc(r.label||'Download (PDF)')}</a></div></div>`).join('')}</div></div></section>
${ctaBand(c, R.ctaHeading, R.ctaText)}`;
    return {path:'/resources/', title:R.title, description:plain(R.intro), body};
  }

  function blogIndex(c){
    const B=c.blog, posts=[...B.posts].sort((a,b)=>b.date.localeCompare(a.date));
    const body=`${hero({title:B.title,text:B.intro,image:B.heroImage,eyebrow:B.eyebrow,compact:true})}
<section><div class="wrap"><div class="grid-3">${posts.map(postCard).join('')}</div></div></section>
${ctaBand(c, B.ctaHeading, B.ctaText)}`;
    return {path:'/blog/', title:B.title, description:plain(B.intro), body, image:B.heroImage};
  }

  function postPage(c, p){
    const posts=[...c.blog.posts].sort((a,b)=>b.date.localeCompare(a.date));
    const i=posts.findIndex(x=>x.slug===p.slug);
    const related=posts.filter((x,n)=>n!==i).slice(Math.max(0,i-1),Math.max(0,i-1)+3);
    const crumbItems=[{label:'Home',href:'/'},{label:'Blog',href:'/blog/'},{label:p.title,href:`/blog/${p.slug}/`}];
    const body=`<section style="padding-bottom:30px"><div class="wrap narrow">${crumbs(crumbItems)}<div class="eyebrow">Insight</div><h1>${esc(p.title)}</h1><div class="post-meta" style="margin-top:14px"><span>${fmtDate(p.date)}</span>${p.author?`<span>·</span><span>By ${esc(p.author)}</span>`:''}</div>${p.hero?`<img class="post-hero" src="${attr(p.hero)}" alt="">`:''}</div></section>
<section style="padding-top:0"><div class="wrap narrow"><article class="prose">${md(p.body)}</article></div></section>
<section class="bg-mist"><div class="wrap"><div class="section-head"><h2>More from the blog</h2></div><div class="grid-3">${related.map(postCard).join('')}</div></div></section>
${ctaBand(c, c.blog.ctaHeading, c.blog.ctaText)}`;
    const jsonld={"@context":"https://schema.org","@type":"BlogPosting","headline":p.title,"datePublished":p.date,"dateModified":p.updated||p.date,"author":{"@type":"Person","name":p.author||c.site.name},"publisher":{"@type":"Organization","name":c.site.name,"logo":{"@type":"ImageObject","url":c.site.url.replace(/\/$/,'')+c.site.logo}},"image":p.hero?c.site.url.replace(/\/$/,'')+p.hero:undefined,"mainEntityOfPage":c.site.url.replace(/\/$/,'')+`/blog/${p.slug}/`,"description":trunc(p.excerpt||p.body,160)};
    return {path:`/blog/${p.slug}/`, title:p.title, description:trunc(p.excerpt||p.body,160), body, jsonld, type:'article', image:p.hero};
  }

  function contactPage(c){
    const K=c.contact, S=c.site;
    const mailto = `mailto:${S.email}`;
    const body=`${hero({title:K.title,text:K.intro,eyebrow:K.eyebrow,compact:true,plain:true})}
<section style="padding-top:20px"><div class="wrap"><div class="contact-grid">
  <div>
    <h2 style="margin-bottom:22px">${esc(K.detailsHeading)}</h2>
    <dl>
      <div><dt>Email</dt><dd><a href="${attr(mailto)}">${esc(S.email)}</a></dd></div>
      ${S.phone?`<div><dt>Phone</dt><dd><a href="tel:${attr(S.phone.replace(/\s+/g,''))}">${esc(S.phone)}</a></dd></div>`:''}
      ${S.addressLine1?`<div><dt>Address</dt><dd>${esc(S.name)}<br>${esc(S.addressLine1)}<br>${esc(S.addressCity)} ${esc(S.addressPostcode)}</dd></div>`:''}
      ${K.hours?`<div><dt>Office hours</dt><dd>${esc(K.hours)}</dd></div>`:''}
    </dl>
    ${K.note?`<p style="margin-top:22px;color:var(--slate);font-size:15px">${esc(K.note)}</p>`:''}
    ${K.image?`<img src="${attr(K.image)}" alt="" style="border-radius:16px;margin-top:30px" loading="lazy">`:''}
  </div>
  <form class="form" onsubmit="return cdSend(this)">
    <h3>${esc(K.formHeading)}</h3>
    <label>Your name<input name="name" required></label>
    <label>Email address<input name="email" type="email" required></label>
    <label>Company<input name="company"></label>
    <label>Tell us about your project<textarea name="message" required></textarea></label>
    <button class="btn" type="submit">${esc(K.formButton||'Send message')}</button>
    <p style="font-size:13px;color:var(--slate)">${esc(K.formNote||'')}</p>
  </form>
</div></div></section>
<script>function cdSend(f){var b='Name: '+f.name.value+'\\nEmail: '+f.email.value+'\\nCompany: '+f.company.value+'\\n\\n'+f.message.value;location.href='${mailto}?subject='+encodeURIComponent('${esc(K.formSubject||'Website enquiry')}')+'&body='+encodeURIComponent(b);return false;}<\/script>`;
    return {path:'/contact/', title:K.title, description:plain(K.intro), body};
  }

  function termsPage(c){
    const T=c.terms;
    const body=`${hero({title:T.title,eyebrow:'Legal',compact:true,plain:true})}
<section><div class="wrap narrow"><div class="prose">${md(T.body)}</div></div></section>`;
    return {path:'/terms/', title:T.title, description:`Terms and conditions of use for the ${c.site.name} website.`, body};
  }

  function notFound(c){
    return {path:'/404.html', title:'Page not found', description:'Page not found', body:`${hero({title:'Page not found',text:'Sorry, we could not find that page. It may have moved when we rebuilt the site.',compact:true,plain:true,ctaLabel:'Go to the homepage',ctaHref:'/'})}<section><div class="wrap"><div class="section-head"><h2>Popular pages</h2></div><div class="grid-3">${c.work.caseStudies.slice(0,3).map(workCard).join('')}</div></div></section>`};
  }

  function allPages(c){
    const pages=[homePage(c), workIndex(c)];
    c.work.caseStudies.forEach(cs=>pages.push(caseStudyPage(c,cs)));
    pages.push(servicesIndex(c));
    c.services.pillars.forEach(p=>pages.push(pillarPage(c,p)));
    c.services.pages.forEach(s=>pages.push(servicePage(c,s)));
    pages.push(sellingPage(c), trainingPage(c), aboutPage(c), resourcesPage(c), blogIndex(c));
    c.blog.posts.forEach(p=>pages.push(postPage(c,p)));
    pages.push(contactPage(c), termsPage(c), notFound(c));
    return pages;
  }
  function buildPages(c){
    const out={};
    for(const p of allPages(c)){
      const file = p.path==='/404.html' ? '404.html' : p.path.replace(/^\//,'') + 'index.html';
      out[file]=layout(c,p);
    }
    return out;
  }
  function pageList(c){ return allPages(c).map(p=>({path:p.path,title:p.title||'Home'})); }
  function renderPath(c, path){
    const p = allPages(c).find(x=>x.path===path) || homePage(c);
    return layout(c,p);
  }
  window.CD = { buildPages, pageList, renderPath, esc };
})();
</script>

function renderSidebar(){

function selectSection(k){ activeSection=k; if(PREVIEW_FOR[k]){ previewPath=PREVIEW_FOR[k]; $('pageSelect').value=previewPath; refreshPreview(); } renderSidebar(); renderEditor(); }

/* generic form renderer — fields bind directly to the content object via path arrays */
function get(obj,path){ return path.reduce((o,k)=>o==null?undefined:o[k],obj); }
function set(obj,path,val){ let o=obj; for(let i=0;i<path.length-1;i++){ if(o[path[i]]==null) o[path[i]]= typeof path[i+1]==='number'?[]:{}; o=o[path[i]]; } o[path[path.length-1]]=val; }
function resolveImg(src){ if(!src) return ''; if(/^(https?:|data:)/.test(src)) return src; const base=(content.site.previewBase||content.site.url||'').replace(/\/$/,''); return base+src; }
function fieldHTML(f, path){
  const id='f_'+path.join('_').replace(/[^a-z0-9_]/gi,'_');
  const v=get(content,path);
  const p=JSON.stringify(path).replace(/"/g,'&quot;');
  const hint=f.hint?`<div class="sub">${f.hint}</div>`:'';
  switch(f.type){
    case 'text': return `<div class="field"><label>${f.label}</label><input type="text" value="${CD.esc(v??'')}" oninput="set(content,${p},this.value);markDirty()">${hint}</div>`;
    case 'number': return `<div class="field"><label>${f.label}</label><input type="number" value="${CD.esc(v??'')}" oninput="set(content,${p},Number(this.value));markDirty()">${hint}</div>`;
    case 'textarea': return `<div class="field"><label>${f.label}</label><textarea class="${f.tall?'tall':''}" oninput="set(content,${p},this.value);markDirty()">${CD.esc(v??'')}</textarea>${hint}</div>`;
    case 'paras': return `<div class="field"><label>${f.label}</label><textarea class="tall" oninput="set(content,${p},this.value.split(/\\n\\s*\\n/).map(s=>s.trim()).filter(Boolean));markDirty()">${CD.esc((v||[]).join('\n\n'))}</textarea>${hint}</div>`;
    case 'lines': return `<div class="field"><label>${f.label}</label><textarea oninput="set(content,${p},this.value.split(/\\n/).map(s=>s.trim()).filter(Boolean));markDirty()">${CD.esc((v||[]).join('\n'))}</textarea>${hint}</div>`;
    case 'image': return `<div class="field"><label>${f.label}</label><div class="img-row"><img src="${CD.esc(resolveImg(v))}" alt="" onerror="this.style.opacity=.2"><input type="text" value="${CD.esc(v??'')}" placeholder="/images/channel-dynamics-….jpg" oninput="set(content,${p},this.value);markDirty();this.previousElementSibling.src=resolveImg(this.value)"><button class="mini-btn" onclick="pickImage(${p})">Choose</button></div>${hint||'<div class="sub">Path inside site/ (upload the file to site/images/ with a channel-dynamics-… name).</div>'}</div>`;
    case 'object': return `<div class="list-item"><div class="li-head"><span class="li-title">${f.label}</span></div><div class="li-body">${f.fields.map(sf=>fieldHTML(sf,path.concat(sf.key))).join('')}</div></div>`;
    case 'list': {
      const arr=v||[];
      return `<div class="field"><label>${f.label}</label>${hint}</div>`+arr.map((item,i)=>`<div class="list-item collapsed" id="${id}_${i}"><div class="li-head" onclick="this.parentElement.classList.toggle('collapsed')"><span class="li-title">${i+1}. ${CD.esc(item[f.titleKey]||'')}</span><span class="li-controls" onclick="event.stopPropagation()"><button class="mini-btn" onclick="moveItem(${p},${i},-1)">↑</button><button class="mini-btn" onclick="moveItem(${p},${i},1)">↓</button><button class="mini-btn" onclick="removeItem(${p},${i})">✕</button></span></div><div class="li-body">${f.of.map(sf=>fieldHTML(sf,path.concat(i,sf.key))).join('')}</div></div>`).join('')+`<button class="add-btn" onclick="addItem(${p},${JSON.stringify(f.of.map(x=>x.key)).replace(/"/g,'&quot;')})">+ Add ${f.label.replace(/s$/,'')}</button>`;
    }
  }
  return '';
}
function moveItem(path,i,d){ const arr=get(content,path); const j=i+d; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; markDirty(); renderEditor(); }
function removeItem(path,i){ if(!confirm('Remove this item?')) return; get(content,path).splice(i,1); markDirty(); renderEditor(); }
function addItem(path,keys){ let arr=get(content,path); if(!arr){ arr=[]; set(content,path,arr); } const o={}; keys.forEach(k=>o[k]=''); arr.push(o); markDirty(); renderEditor(); setTimeout(()=>{ const items=document.querySelectorAll('.list-item.collapsed'); const last=items[items.length-1]; if(last) last.classList.remove('collapsed'); },0); }
function pickImage(path){ const ip=$('imgPick'); ip.onchange=()=>{ const f=ip.files[0]; ip.value=''; if(!f) return; const name='/images/channel-dynamics-'+f.name.toLowerCase().replace(/^channel-dynamics-/,'').replace(/[^a-z0-9.]+/g,'-'); set(content,path,name); markDirty(); renderEditor(); toast('Set to '+name+' — copy the file into site/images/ with that name.'); }; ip.click(); }

function renderEditor(){
  const s=SCHEMAS[activeSection]; let html=`<h2>${s.title}</h2><div class="hint">${s.hint||''}</div>`;
  if(activeSection==='nav'){
    html+=fieldHTML({key:'nav',label:'Menu items',type:'list',of:[txt('label','Label'),txt('href','Link'),list('children','Dropdown items',link,'label')],titleKey:'label'},['nav']);
    html+=fieldHTML({key:'navCta',label:'Menu button',type:'object',fields:[txt('label','Label'),txt('href','Link')]},['navCta']);
  } else if(activeSection==='clients'){
    html+=fieldHTML({key:'clients',label:'Clients',type:'list',of:[txt('name','Name'),img('image','Logo')],titleKey:'name'},['clients']);
  } else {
    html+=s.fields.map(f=>fieldHTML(f,[activeSection,f.key])).join('');
  }
  $('editor').innerHTML=html;
}

/* ---------- preview ---------- */
let previewTimer=null;
function refreshPreviewSoon(){ clearTimeout(previewTimer); previewTimer=setTimeout(refreshPreview,350); }
function refreshPreview(){
  try{
    let html=CD.renderPath(content, previewPath);
    const base=(content.site.previewBase||content.site.url||'').replace(/\/$/,'')+'/';
    const hook=`<base href="${base}"><script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href')||'';if(h.startsWith('/')&&!/\\.[a-z]+$/i.test(h)){e.preventDefault();parent.postMessage({cdNav:h},'*');}});<\/script>`;
    html=html.replace('<head>','<head>'+hook);
    $('previewFrame').srcdoc=html;
  }catch(e){ $('previewFrame').srcdoc='<pre style="padding:20px;color:#b00">Preview error: '+CD.esc(e.message)+'</pre>'; console.error(e); }
}
window.addEventListener('message',e=>{ if(e.data&&e.data.cdNav){ const list=CD.pageList(content); const path=e.data.cdNav.endsWith('/')?e.data.cdNav:e.data.cdNav+'/'; if(list.some(p=>p.path===path)){ previewPath=path; $('pageSelect').value=path; refreshPreview(); } } });
function fillPageSelect(){ const sel=$('pageSelect'); sel.innerHTML=CD.pageList(content).map(p=>`<option value="${p.path}">${CD.esc(p.path)}  —  ${CD.esc(p.title)}</option>`).join(''); sel.value=previewPath; }
function setDevice(d){ $('previewFrame').classList.toggle('mobile',d==='mobile'); $('devDesktop').classList.toggle('active',d==='desktop'); $('devMobile').classList.toggle('active',d==='mobile'); }

/* ---------- boot ---------- */
loadContent();
renderSidebar(); renderEditor(); fillPageSelect(); refreshPreview();
setInterval(()=>{ if(dirty) saveContent(false); }, 30000);
window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
</script>
