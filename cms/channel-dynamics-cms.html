<style>
  :root{ --red:#E4130E; --red-dark:#AB0116; --ink:#14181D; --slate:#525B68; --mist:#F4F5F7; --line:#E3E6EA; --white:#fff; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Manrope',system-ui,sans-serif;background:var(--mist);color:var(--ink);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  .topbar{background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:58px;flex-shrink:0}
  .topbar .brand{font-weight:800;letter-spacing:.02em;font-size:15px;display:flex;align-items:center;gap:10px}
  .topbar .brand .dot{width:22px;height:22px;border-radius:50%;background:var(--red);display:inline-grid;place-items:center}
  .topbar .brand small{display:block;font-size:9px;letter-spacing:.22em;color:#9aa3ad;text-transform:uppercase;font-weight:600}
  .topbar .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tb-btn{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 12px;border-radius:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  .tb-btn:hover{border-color:var(--red);color:#fff;background:rgba(228,19,14,.25)}
  .tb-btn.primary{background:var(--red);border-color:var(--red)}
  .tb-btn.primary:hover{background:var(--red-dark)}
  #saveStatus{font-size:11px;color:#9aa3ad;min-width:120px;text-align:right}
  .app{display:flex;flex:1;min-height:0}
  .sidebar{width:210px;background:var(--white);border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0;padding:10px 0}
  .side-group{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#8a93a0;font-weight:800;padding:14px 18px 6px}
  .side-item{display:block;width:100%;text-align:left;background:none;border:none;border-left:3px solid transparent;padding:8px 18px;font-size:13px;color:var(--ink);font-weight:500}
  .side-item:hover{background:var(--mist)}
  .side-item.active{border-left-color:var(--red);background:var(--mist);font-weight:700}
  .editor{width:430px;border-right:1px solid var(--line);overflow-y:auto;padding:22px;background:var(--mist);flex-shrink:0}
  .editor h2{font-size:18px;font-weight:800;margin-bottom:4px}
  .editor .hint{font-size:12px;color:var(--slate);margin-bottom:18px;line-height:1.5}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red-dark);margin-bottom:5px}
  .field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-family:inherit;font-size:13px;background:var(--white);color:var(--ink)}
  .field textarea{min-height:70px;resize:vertical;line-height:1.5}
  .field textarea.tall{min-height:180px}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--red);border-color:var(--red)}
  .field .sub{font-size:11px;color:#8a93a0;margin-top:4px}
  .img-row{display:flex;gap:8px;align-items:center}
  .img-row img{width:54px;height:54px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;flex-shrink:0}
  .img-row input{flex:1}
  .mini-btn{border:1px solid var(--line);background:var(--white);border-radius:6px;padding:5px 9px;font-size:11px;font-weight:700;color:var(--ink)}
  .mini-btn:hover{border-color:var(--red);color:var(--red)}
  .list-item{border:1px solid var(--line);border-radius:8px;background:var(--white);padding:12px;margin-bottom:10px}
  .list-item .li-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;cursor:pointer}
  .list-item .li-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li-controls{display:flex;gap:4px}
  .list-item.collapsed .li-body{display:none}
  .add-btn{width:100%;border:1.5px dashed var(--red);background:none;color:var(--red-dark);border-radius:8px;padding:9px;font-size:12px;font-weight:700;margin-bottom:14px}
  .add-btn:hover{background:#fdeceb}
  .preview{flex:1;display:flex;flex-direction:column;min-width:0;background:#e9ebee}
  .preview-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--white);gap:10px;flex-wrap:wrap}
  .preview-bar .label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:#8a93a0}
  .preview-bar select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:inherit;font-size:12px;max-width:320px}
  .dev-toggle{display:flex;gap:6px}
  .dev-btn{border:1px solid var(--line);background:var(--white);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700}
  .dev-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .preview-frame-wrap{flex:1;display:flex;justify-content:center;overflow:auto;padding:14px}
  #previewFrame{border:1px solid var(--line);background:#fff;width:100%;height:100%;border-radius:6px;transition:width .25s}
  #previewFrame.mobile{width:390px;flex-shrink:0}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:none}
  .notice{background:#fff8e6;border:1px solid #f0d58a;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:16px;color:#6b5300}
  code{background:#fff;border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></span><span>Channel Dynamics<small>Site Manager</small></span></div>
  <div class="actions">
    <span id="saveStatus">Loaded defaults</span>
    <button class="tb-btn" onclick="exportJSON()">Backup JSON</button>
    <button class="tb-btn" onclick="importJSON()">Import JSON</button>
    <button class="tb-btn" onclick="resetDefaults()">Reset to defaults</button>
    <button class="tb-btn" onclick="exportPage()">Export this page</button>
    <button class="tb-btn primary" onclick="saveContent(true)">Save</button>
    <input type="file" id="jsonPick" accept="application/json" style="display:none">
    <input type="file" id="imgPick" accept="image/*" style="display:none">
  </div>
</div>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="editor" id="editor"></div>
  <div class="preview">
    <div class="preview-bar">
      <span class="label">Live preview</span>
      <select id="pageSelect" onchange="previewPath=this.value;refreshPreview()"></select>
      <div class="dev-toggle"><button class="dev-btn active" id="devDesktop" onclick="setDevice('desktop')">Desktop</button><button class="dev-btn" id="devMobile" onclick="setDevice('mobile')">Mobile</button></div>
    </div>
    <div class="preview-frame-wrap"><iframe id="previewFrame" title="Site preview"></iframe></div>
  </div>
</div>
<div class="toast" id="toast"></div>

   {
    "slug": "recommendations-will-help-sell-products",
    "title": "Recommendations Will Help You Sell More Products",
    "date": "2019-01-16",
    "author": "Oliver Strange",
    "hero": "/images/channel-dynamics-ecommerce-top.webp",
    "excerpt": "If you’re offering products or services on your website, there is an easy way to boost sales. Provide recommendations on which product to buy. In our experience, supported by this study, we’ve seen that 45% of UK shoppers admit to checking out with the recommended products displayed at the point of…",
    "body": "If you’re offering products or services on your website, there is an easy way to boost sales. Provide recommendations on which product to buy. In our experience, supported by this study, we’ve seen that 45% of UK shoppers admit to checking out with the recommended products displayed at the point of sale. This creates great opportunity when designing how you display your products.\n\n### How do I Give Recommendations?\n\nThere are different ways you can recommend products. Draw attention to a product by displaying it in a larger size than the other products on the page. Amazon uses this technique effectively on their homepage. Adding, “we recommend” above the product can also give the same effect.\n\n![conversion recommendations products](/images/channel-dynamics-untitled.png)\n\n## First product is larger than the others displayed\n\n![product recommendation](/images/channel-dynamics-screen-shot-2017-07-25-at-14-44-03.png)\n\n### What Should I Recommend?\n\nA study from invesp shows that 56% of online users are more likely to return to a site that offers recommendations. To take advantage of this, recommendations need to appeal to the user. Categories that are often effective include:\n\n- Similar items- items similar to recent views or buys reflect the user’s interests so are likely to be purchased.\n- Best sellers- showing the user what others have been buying could encourage the user to buy those products.\n- Featured products- showing something new could interest the user to click on it and possibly buy.\n- Offers and deals- discounts make the product far more likely to sell and recommending these improves the chances of the user buying it.\n- Buy and save- deals such as “3 for 2” are often effective.\n- Other effective categories include: new arrivals, recently viewed products and top reviewed products.\n\n![product recommendation sales](/images/channel-dynamics-screen-shot-2017-07-25-at-14-47-03.png)\n\nRecommendations can be a very important addition your website. They can increase your sales and keep users interested. By simply following the advice above your website can reach its full potential."
   },
   {
    "slug": "get-more-clicks-with-calls-to-action",
    "title": "Get More Clicks with Calls to Action",
    "date": "2018-12-05",
    "author": "Oliver Strange",
    "hero": "/images/channel-dynamics-calls-to-action-e1502455539477.jpg",
    "excerpt": "What is a Call to Action? A call to action is a link leading to your landing page that tells users what you’re offering. Calls to action are commonly seen as buttons, images and lines of text. A study from Wordstream revealed that emails with a call to action button increased clicks by 371% and sale…",
    "body": "### What is a Call to Action?\n\nA call to action is a link leading to your landing page that tells users what you’re offering. Calls to action are commonly seen as buttons, images and lines of text. A study from Wordstream revealed that emails with a call to action button increased clicks by 371% and sales by 1617%. By learning to use calls to action effectively, you can easily achieve results like these on your website.\n\n![cta](/images/channel-dynamics-stuff.png)\n\n### How do I use an Effective Call to Action?\n\nSimply putting a line of text saying “click here!” won’t be very effective. There are several steps you can take to make sure that users do something when they are displayed with your call to action.\n\n1. Make it action oriented- Tell the user to do something, for example “download” or “click”.\n2. Make it eye catching- Make sure that it is the first thing users sees to maximise the chances of clicking on it.\n3. Keep it above the fold- Like above, this makes sure the user will see the call to action. This will maximise its chance of being clicked on.\n4. Make it clear what the offer is- Users will have no reason to click on your call to action without any offer or proposal. Placing the offer on the button itself will make the offer more obvious for the user to see.\n5. Make your call to action look like a button- This study found that when calls to action were made to look like buttons using 3D effects, clicks were increased by 45%.\n6. Use scarcity to encourage action- If you are selling something with limited stock on your website this technique is very effective. Drawing extra attention to the fact that the stock is limited can encourage users to buy because they will fear that if they do not buy your product it will be gone. Booking.com uses this technique well, shown below.\n\n![](/images/channel-dynamics-screen-shot-2017-07-27-at-13-37-49.webp)\n\n### How do Calls to Action Work?\n\nCalls to action take advantage of the user’s curiosity and anticipation. When the user sees a call to action on your website, it must display and offer. This way they will anticipate getting something out of your call to action, and will be much more likely to click it. To take advantage of curiosity, many effective calls to action utilise words such as “secrets” and phrases like “tips the pros use”. Good calls to action also give a glimpse into what they’re offering without giving away too much information for free. Sometimes a short bullet points or a short summary is used. This makes the user curious to find out more about the small amount of information they have been given. By taking advantage of these two factors of anticipation and curiosity, your call to action could become extremely effective.\n\n![good cta](/images/channel-dynamics-pic2.png)\n\nCalls to action can massively increase the sales and click rates on your website. By following the tips above, you could use calls to action to draw people to to your website and even use psychology to gain more profit from your website."
   },
   {
    "slug": "voice-recognition-and-ux",
    "title": "Voice Recognition and UX",
    "date": "2018-10-18",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-32.jpg",
    "excerpt": "",
    "body": "For as long as we know it, computers have been an important part of our lives. And all that time we´ve been interacting with them one way or another. Back in the 1950s, this interaction consisted of pressing keys and entering commands into the command line. Before that, commands had to be given to the computer using a punch card or paper tape. It was not until 1978 and the invention of VT100, a video terminal developed by DEC, that the users could see command line information more quickly. When they emerged in the 1980s, GUIs made computers much easier to use. Nowadays, it is almost impossible to imagine working on a computer without an iconic mouse.\n\nToday, when all of us have at least one smartphone in our pocket, it is only a matter of time when voice interaction will become the preferred input method. And according to the demos shown at CES 2017 and all the buzz on tech blogs, it seems that time is now.\n\nIn this article, we will try to explain the implications of voice interaction and its potential for UX design. Same as the smartphones evolved from a UX playground to user-friendly designs, we expect the same will happen to voice-enabled devices. With what seems to be a limitless potential, voice interaction has the potential to redefine UX from the ground up through innovative and user-centric design.\n\n## 2017: The year of voice\n\nThis year´s CES has brought us a great deal of announcements about new product launches. From a cat feeder that prevents overeating by recognizing the cat´s microchip, to the Qualcomm´s new Snapdragon 835 chip, the products announced at CES will surely fill the tech news for months to come. Besides dozens of exciting product announcements, CES 2017 has also revealed a new trend that could redefine the way we interact with our electronic devices – voice interaction.\n\nDuring his speech at CES, Shawn DuBravac, Chief Economist of the Consumer Technology Association stated that this year presents an inflection point in the computer´s ability to translate speech to text. Since 1994 when these experiments first started, the error rate of such a translation was roughly 100 percent. In 2013, the error rate dropped to 23%. This year, that error rate is expected to drop as low as 6%.\n\nLeading the trend in the field of voice interaction are Apple´s Siri and Google´s Now, but from what we saw at CES this year, the leaderboard is about to change. Stealing the show last year, Amazon´s voice-activated assistant Alexa was everywhere you look. And according to latest news coming from Amazon, it will not take long for Alexa to be omnipresent. While Siri and Google Now are already embedded in smartphones, Amazon´s Echo (Alexa) is taking a different approach by offering voice interaction on stationary devices – from Lenovo smart devices to Whirlpool´s appliances.\n\nAnd cars!\n\nTesla´s Model S has an in-built voice command feature that combines Google´s voice recognition with its search and maps features. This useful feature is often completely overlooked mostly because most users intuitively end up using the massive touch screen. We could say that people are visual creatures or that old habits die hard. But using a touch screen to setup a navigation during driving is much more complicated (and dangerous) than simply saying “Drive home”. And Tesla is not the only one who is experimenting with voice. Several vehicle manufacturers already offer their vehicles with fully integrated communication and entertainment systems. Ford and Fiat go a step further and, same as Tesla, offer voice recognition for most of the systems in their cars. Voice recognition is used to control those systems through a complex set of commands.\n\n## One voice to rule them all\n\nMarketed as completely different and one better than the other, in reality, all three of the aforementioned solutions, with the addition of Microsoft Cortana, work in a similar way. They all operate in stand-by patiently waiting for the user to say the “activation” phrase after which they execute the user´s command such as to reproduce music, set a timer, or to find information about something. For instance, if you ask all of them to do a rather simple task such as “Send an email to John Doe”, the results would be as follows:\n\nSiri and Google Now will perform the task without any issues. They will recognize the name from your contacts, let you dictate your message, and send it out. The minor difference was the fact that Siri lets you specify the subject line. The major difference is the obvious one: Siri works only with Apple Mail, and Google Now with Gmail.\n\nCortana managed to do the task but not as smooth as Siri and Google Now. It still has some trouble with misheard words such as asking you if you want to text someone instead of emailing them.\n\nAlexa could not even understand the question.\n\nThe above example is just one amongst many tests conducted on the subject and most of them clearly indicate that Alexa is not the brightest one. It´s funny if you consider that Echo (Alexa) came to life years after Siri and Google Now. Besides being somewhat “slow”, Alexa´s biggest disadvantage is the lack of a screen that could show visual output such as search results. Echo has a smartphone app but its focus is only on adjusting some settings and functions while the whole interaction is done inside of the actual device. Reading this has probably got you thinking that Alexa is one big step backwards. So why would anyone give their money for a device that works worse than the ones they already have?\n\nThe answer lies in error prevention. Amazon´s Alexa thinks it is better to prevent errors from occurring than to just help users recover from them. In line with the improved results in speech recognition that we mentioned above, errors of understanding natural language have dropped significantly, and there is no reason why this positive trend would not continue in the following years. Still, there is one very common type of error with smartphone voice interaction – completely failing to detect the “activation” phrase in noisy environments.\n\nBecause of it, Siri often finds it difficult to understand voice commands if there is noise in the background, no matter whether that noise is just noise or background music. Siri also fails if the device is tucked in a pocket or not within reach. Contrary to Siri, Echo´s only priority is voice interaction. With its 7 microphones and a strong emphasis on distinguishing voice from background noises, Alexa will reply to you even if it is on the opposite side of the room.\n\n## The potential of voice\n\nWhen a new technology becomes available, some people want to start from the start and reinvent the wheel. Removing a visual display is just one example as it changes the complete interaction experience and we have to ask ourselves: does the shift from visual to voice mean that all the rules have changed?\n\nYes.\n\nThere are no images that would help articulate actions more clearly. There are no animations that would explain complex actions more easily. There is nothing to click. Think about it. One of the most fundamental UX element of the Internet, the hyperlink, is no longer there.\n\nAnd, as the popularity of voice interaction continues to rise, UX professionals are quickly starting to realize that words are becoming more important than ever. With no visual cues that would guide the user, words are the only thing on which the user will evaluate and rate the overall customer experience. As designers will have to rely 100 percent on words and phrases, it will create a strong need for a standardized set of words and phrases that will allow users to seamlessly move and navigate between different voice systems. It is needless to say that memorizing a different set of commands for each voice system is something that most users will not want to do.\n\nOne of the key concerns for UX experts that lead the transition from visual to voice will be the need for constant interpretation of actions between the two interfaces. Without having a mouse to perform actions, they will have to anticipate the user´s intent at every step of the process and set a meaningful response. For instance, simply saying “Delete it” can be a valid voice command in different voice systems. But the consequences of such an action can be completely different in different systems. As there are infinite ways to say something, UX designers will have to be sure they are asking the right questions in order to get the right verbal response from the user.\n\nIn line with the above, designers can start designing for a finite set of possibilities that are most likely to follow their use case. And that´s the key: to define a reason why the user performs the interaction in the first place. Some of the use cases with greatest potential are people with certain disabilities such as not being able to use a mouse or a keyboard, users working on complex assignments such as driving special vehicles or operating on large equipment.\n\nThere is also a question of privacy. Switching to voice interaction will possibly open a completely new attack ground for malicious attackers. Most devices that have voice interaction store and remember user credentials. If our voice is the key of this new kingdom, we have to protect it in order to prevent someone to record it and use it to synthetize commands you never gave. These are just some of the obvious privacy concerns that UX experts need to address but as the popularity of voice continues to rise, so will the need to protect the voice-enabled devices from unwanted access.\n\nBut the biggest difficulty of all is the social awkwardness. If you completely ignore the fact how precise we have honed the accuracy of voice recognition, and that several voice AIs are already in use, there is still a great deal of awkwardness in using them in public. Same as with small earphones that made people look like they are talking to themselves, the awkwardness of using voice interaction will probably get lost in translation. But for now, the problem is still here and UX designers must take it into account when designing for voice interaction. One way of dealing with it is to try to come up with the shortest dialogue flow possible. This approach can sometimes have a negative impact on accuracy so a tradeoff between duration and accuracy must be found.\n\n## Conclusion\n\nAs we said at the beginning of this post, voice is the next big deal for UX design and we expect that its popularity will grow rapidly in the years to come.\n\nMost of the UX paradigms that have been providing a shared basis for developing new ideas can´t even be applied to voice. This means that UX experts need to start embracing and refining this technology. As a part of achieving this goal, they need to carefully shape the vocabulary used in voice interactions, as well as to try to predefine the users´ intent at each and every step of the process.\n\nOnce the dust settles, it will be up to UX experts to strengthen user engagement by personalizing and improving the way how AI voice assistants reply to your orders. The first steps will be in making the whole interaction process clearer and more understandable. Once we manage to achieve that, the focus will probably be put on creating complete branded personas. But, as we could learn from currently available voice AIs, as long as there is a clear distinction between a robot and a human, people can really enjoy interacting with their artificial companion."
   },

    "slug": "trust-badges-can-increase-your-conversion-rate",
    "title": "Trust Badges can Increase Your Conversion Rate",
    "date": "2018-07-10",
    "author": "Oliver Strange",
    "hero": "/images/channel-dynamics-trustbadges.png",
    "excerpt": "There is a simple way to increase conversion on any website selling products or services. Use trust badges. A study conducted by Synovate revealed that 94% of shoppers were more likely to complete a purchase when the Norton trust badge was displayed. This shows that trust badges are definitely somet…",
    "body": "There is a simple way to increase conversion on any website selling products or services. Use trust badges. A study conducted by Synovate revealed that 94% of shoppers were more likely to complete a purchase when the Norton trust badge was displayed. This shows that trust badges are definitely something that you need to be taking advantage of on your website.\n\n### What are Trust Badges?\n\nTrust badges are icons which show users that your website has been checked by a third party to confirm that it’s authentic. There are many commonly used trust badges, but the most common and trusted one, shown by this graph from Baymard Institute, is the Norton trust badge.\n\n![trust stamp graph](/images/channel-dynamics-screen-shot-2017-07-26-at-14-28-03.png)\n\n### How do I use Trust Badges?\n\nTrust badges are best used where personal information needs to be entered. The diagram below shows a test conducted by blue fountain media. It proved that when the trust badge was visible sales were increased by 42%. You could achieve the same effect on your website if you follow the same steps as shown below. The second page has an easily visible trust badge next to the area where personal information is entered, boosting the conversion rate.\n\n![before trust stamp](/images/channel-dynamics-screen-shot-2017-07-26-at-14-23-58.png)\n\n![after trust stamp](/images/channel-dynamics-screen-shot-2017-07-26-at-14-24-10.png)\n\nHow do Trust Badges Work?\n\nWhen the user then sees this badge, they trust the website displaying it. The user will feel more comfortable buying from your website and signing up to your newsletter. A study from Matthew Neiderberger proves that 70% of online shoppers cancelled their order because they didn’t trust the seller. That’s something that must be avoided, and trust badges can solve that.\n\nTrust badges are a very useful addition to your website. They can boost conversion rates by proving to users that your website can be trusted. If you want to get the most out of your website, use trust symbols."
   },
   {
    "slug": "virtual-reality-ux-design-considerations",
    "title": "Virtual Reality UX Design Considerations",
    "date": "2018-05-17",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-33.jpg",
    "excerpt": "",
    "body": "If we take a look back on last year tech news, it looks like everyone was talking about virtual reality (VR). Some of the tech companies that were just exploring the technology have now started to push aggressively into VR. Other companies quickly followed so we had a chance to watch an NBA game in VR for the first time. CNN did the same by streaming a presidential debate in VR.\n\nIf we take another look into the past 20 years, we will still be able to see VR in the news. So, what´s changed? Is this just a trend that will start to fade away or has the time of VR finally arrived?\n\nIt´s safe to say yes. But we also need to say why. With more and more people starting to dive into virtual reality, and VR devices becoming more and more affordable, it´s safe to say that, this time, VR is here to stay. And the change it will cause will change our lives from the ground up. On the pinnacle of that change will be UX professionals who, as the creators of user experiences, will have to develop new design strategies that will be able to adapt to VR, and stay (at least) one step ahead of this technological revolution.\n\nThe opportunity for UX professionals and enthusiasts is massive. We will have to conceptualize completely new ways of interaction for shopping, education, collaboration, content presentation, entertainment and more. The whole concept of VR is still relatively new and no rules have yet been carved into stone. In a world without any limitations, the only limitation for us is our imagination and we can let it run wild. It is a new world for you to explore and in order to help you out a bit, we have decided to devote this article to some considerations for UX in virtual reality. But before we go deeper into it, let us try to go back and explain what VR actually is.\n\nWhat is VR?\n\nExplaining virtual reality can be a bit tricky and explanations can vary considerably depending on how old is the person you are asking. For instance, someone younger would say that VR is a technology that allows you to experience images in a 3D simulated environment. For the purpose of this article, however, we will have to broaden that definition a little bit. Virtual reality is a new communication medium that combines audio and video to allow the user to enter a computer generated 3D environment which is so immersive that the word “virtual” is present only in its name. The goal of virtual reality is to give us the ability to experience things and sensations that we could never do on our own: things such as seeing ourselves from the outside or visiting places that we could never visit otherwise.\n\nA couple of years have passed since Facebook acquired Oculus Rift, and the number of VR campaigns and 3D movies is on the constant rise. While VR is still inaccessible for most people, for one reason or another, this has now started to change and as the price of VR headsets continues to plummet, it is obvious that virtual reality is quickly becoming the new reality.\n\nAccording to a survey in which Perkins Coie and Upload surveyed more than 650 startup founders, executives with established technology companies and investors on the future of AR and VR, there is a great promise for a continued growth of the industry but there are some obstacles, as well. Surprisingly, the majority of them did not list the price as their main obstacle. Instead, the survey shows that the main obstacles are lack of compelling content and issues with user experience as the main obstacles for augmented reality (AR) and VR in the following years.\n\n![](/images/channel-dynamics-blog-image-vr.png)\n\nGetting down to numbers, 38% of respondents says that user experience is the biggest obstacle for VR adoption while only 32% mentioned cost as their number one obstacle. Additionally, 37% of respondents claim that inadequate content is the biggest challenge. 23% listed reluctance and 20% technical limitations as their number one obstacle.\n\n![](/images/channel-dynamics-blog-image-v-2.png)\n\nAt the end of the survey, the respondents were asked about their thoughts on the future of VR. The majority of respondents agreed that in the next 2 years, VR and smartphone companies will focus their efforts into developing mobile VR solutions.\n\nWith this increase of popularity of VR, there is a growing need for designers to incorporate VR´s requirements and capabilities in order to create immersive and believable VR environment. Keep reading to find out more about some of the considerations and challenges that UX designers face when crafting VR experiences.\n\n## Immersion\n\nIn the context of virtual reality, the word “immersion” is used to describe the user´s emotional reaction to the virtual world in terms of feeling as if they are actually a part of the virtual world. This means that, since immersion is inherent to the core of VR, the whole environment must be “alive” and sound must play an important role in the whole experience.\n\nFor the purpose of enhancing the immersive aspect of VR, audio and sound must be convincing and go hand in hand with the visuals. Otherwise, it will be impossible to trick the brainto buy into the illusion. On the other hand, motion should be used only to enhance the interaction or draw focus to it, but it should never be overused. If there are many elements moving around at the same time, the user can easily get confused or distracted and if the situation continues for some time, the confusion can get replaced by annoyance. Most of you will agree with us saying that the user mustn´t get annoyed by the interface but instead fall in love with it as he continues to use it.\n\nSame as many of us have been able to experience in 2D games, there are various HUD displays that provide information to the player. If these heads up displays are directly ported from 2D to virtual 3D environment, they can cause confusion and strain. When such displays have to be put in VR environment, it is best to put them at a certain distance so they are not too close to the user. For instance, if they are positioned at a certain distance and the character walks through the space in between, the user should see the character appearing in front and obstructing his view of the HUD. By following this best practice, the immersion is not broken and it helps avoid eye strain and confusion.\n\n## Comfort\n\nOne of the most important things to keep in mind when designing for VR is comfort – keep the user in a state of satisfaction without any feeling of anxiety of pain. This means that interface must be designed in an easy to read way. Generally, text and virtual reality don´t go well together, especially since smaller text can be very hard to read.\n\nAs users are constantly overloaded with visual information, VR means that less is more and GUI should be reduced as much as possible to ensure the minimalism and purity of the design. Another reason why this is important is eye strain which can be a real issue for users wearing VR headsets. To minimize the issue, UX designers need to avoid things such as bright scenes or high density graphics.\n\nOne additional thing that UX designers can do is to use rest frames. One such example is when a person sits on the back seat of a car and is looking out the front window. The person is still able to see other parts of the car while looking out the front window. In this case, the car interior is the rest frame – a part of the scene that the user sees as stationary. One similar example of a rest frame would be the cockpit of the plane in a flight simulator game.\n\n## Experience\n\nWhen talking about VR, it is becoming obvious that users are selecting experiences over products. This means that the success of VR will be based upon exceptional user experiences, rather than exceptional technology. Here we come to yet another common issue in VR – motion sickness. This is a VR challenge that has been present for decades and a number one reason why users have adverse experiences in VR.\n\nCaused by the difference between what the user expects to feel and what he feels, this misbalance in perception can quickly lead to nausea. Fast movements and blunt transitions can quickly make a user feel sick and things such as rotating horizons have the same effect as being on a ship. Asking the user to move their head or body can easily disorient them and make them sick. Considering the importance of motion sickness, we´ll focus more on it than the previous two challenges.\n\nFirst, we need to define what motion sickness really is. According to Lawson, B.D. (2014), motion sickness refers to adverse symptoms and readily available observable signs that are associated with exposure to real and/or apparent motion. Explained in plain words, motion sickness manifests itself when your eyes tell you that you are moving and your body feels otherwise.\n\nThere are three contributing factors why motion sickness occurs:\n\n1.\tSystem factors 2.\tUser factors 3.\tApplication design factors\n\nThese factors cause mismatches between what you see and what your body feels and they manifest in an unpleasant way. For the purpose and clarity of this post, we will focus only on the application design factors and ignore the first two. Additionally, we have to assume that we cannot control the user factors and that users are using high-end hardware that have low latency, high accuracy and high refresh rate. By having these assumptions in place, we can now focus on the application design decisions that need to be made in order to reduce motion sickness.\n\nIn line with the above, the users need to have as much control of their navigation as possible. This is why UX designers need to avoid moving the user around without asking the user for some input. All unexpected changes in the environment which the user is not able to control, will cause the entire virtual world to move in a weird way and result in mismatches between the user´s movement and what they are seeing in their VR headset. Let us try to illustrate it more clearly with a real-world example. Pilots who control their plane experience motion sickness on rare occasions but some of them report motion sickness when they are travelling as passengers. Another thing that we have to ensure is to reduce all types of fidelity and head motion if the hardware cannot support it. If the design has high fidelity, it can use up much more processing power and negatively affect the frame rate in the VR headset. Varying frames per second are one of the recipes for causing motion sickness.\n\nLack of processing power can also cause latency and physical head movements have to be limited when designing the experience for mobile VR. Mobile devices have significantly less computational power when compared to desktop VR experiences. But this approach can reduce the overall quality of the experience and one way of dealing with it is to reduce the amount of polygons in the environment to make room for more head motion.\n\n## Conclusion\n\nAs we continue to walk on the road of UX design for VR, the standard interfaces that we used for 2D no longer apply. Because there is now a Z-axis and the users are no longer able to see their hands in VR, UX experts face an ultimate challenge – they have to reinvent new ways of interacting. Actions such as touching, taking, selecting, and pointing must be conceptualized and created from scratch.\n\nAs standards for communication and interaction in VR are yet to be defined, they are now quickly evolving as they once did for 2D. UX experts are now experimenting with various ways of interacting some of which are surely to become standardized in near future. For now, we can just continue asking ourselves which road the evolution will take us. Will be able to create and customize our own experiences? Will be able to see one another while browsing the web? Nobody knows exactly in which direction VR will take us but one thing is certain: the opportunity for UX designers is huge as they have to come up with completely new ways of interaction.\n\nThe opportunity for UX professionals and enthusiasts is massive. We will have to conceptualize completely new ways of interaction for shopping, education, collaboration, content presentation, entertainment and more. The whole concept of VR is still relatively new and no rules have yet been carved into stone."
   },
   {
    "slug": "augmented-reality-and-its-implications-in-ux",
    "title": "Augmented Reality and its implications in UX",
    "date": "2018-05-10",
    "author": "Robert Elding",
    "hero": "/images/channel-dynamics-blog-31.jpg",
    "excerpt": "",
    "body": "Augmented Reality (AR) is everywhere. Whatever tech blog you open, there will be at least one post about it. As more and more technologies are starting to embrace this growing trend, there is a high degree of chance that AR will grow to much more than it is now. This will only be possible with a deep level of understanding of what goals and context that the users want, and using that knowledge to create a successful AR experiences.\n\nIn line with the above, it is obvious that augmented reality will require detailed studies of human body and brain, as well as human – computer interaction. This is only one of the implications that AR will have on UX and the purpose of this article is to explore these implications and how they will shape the UX strategy.\n\nWhat is AR?\n\nBefore going any further, we would first need to define what AR really is and explain the difference between VR and AR. The two terms are often used in same conversations and those less informed often get confused which is which. While related, they are significantly different and that difference is worth explaining.\n\nAugmented Reality is an innovative technology that combines digital information and the real world by superimposing computer-generated images or text over what a person already sees in their surroundings. As the potential of AR continues to grow and its influence is spreading across different industries, the definition of AR is quickly moving beyond 2D and 3D overlays on top of reality to experiences that are context-driven and fully personalized. This new AR combines contextual computing with technologies such as AI, Big Data, machine learning, sensors and social networks in order to give users tailor-made and adaptive experiences.\n\nSo, what do all these changes mean for UX designers?\n\nFirst, it is important to note that AR provides an enormous opportunity for UX designers who will lead the development of this “new” medium and will be able to redefine the way people experience reality. However, while the opportunity is immense, AR also comes with its own set of UX challenges.\n\n## Implications of Augmented reality on UX\n\nThis new AR we discussed above will be based on the user´s changing environment and context and, as such, highly adaptive. Because of this, UX professionals will need to create seamless experiences in different environments and for multiple devices – all while making sure that the user is always at the center.\n\nIn AR, devices play a very important role and they are no more limited to glasses products such as Google Glass. Now, there is a wide range of data that is continuously analyzed about the user and his surroundings. This data ranges from historical and situational/environmental to demographics and using all that data to create a relevant yet natural and intuitive experience that centers around the user is more than complex. How can UX designers use these new devices and this new technology to create such experiences?\n\nLet´s state the obvious: technology should work in the background and instead of interrupting our lives, it should appear only when we need it to enhance our productivity and connectivity in areas that are important to us.\n\nBeing in the field of user experience for years, we have to ask ourselves first: “How do we want to live in and with AR? How can we use it to shape people´s lives? How can we design AR experiences to improve and ease a user´s life?”\n\nThese questions are ours to answer, but before going into details about AR best practices, let us talk a bit more about its implications on UX.\n\nWhy is it important for UX?\n\nThe way how user interacts with computer and other hand-held devices is changing even faster with AR´s growing popularity. Since AR has the potential of offering a new and innovative interface, the User Experience of AR services is very difficult to envision. As a result, it is important to apprehend what the users are expecting from the experience. Additionally, it is essential to define a set of guidelines and implications for enhancing the UX of AR experiences.\n\nAR interfaces are actually non-command user interfaces where tasks are done using contextual information obtained by a computer system and not through commands explicitly given by the user. In order to interpret that contextual information and augment the reality, the wealth of external inputs must be analyzed in the background, and actions must be done on the results of those analyses.\n\nWith a non-command UI, AR interfaces offer significant opportunities for UX designers to improve user experience. By having various types of information overlaid over the physical world, the user can access this information without the need for any external devices which significantly improves speed and reduced any need for repetitive tasks. Here are 3 fundamental ways how AR changes UX:\n\n1. Decreased cost\n\nClassic user interfaces require the user to conduct a specific action before accessing any information or completing the task. The lack of commands in AR interfaces makes the complete interaction much more efficient and requires much less user effort.\n\n2. Decreased cognitive load of the user\n\nIn some cases such as mechanical engineering, the absence of AR interface would require the engineer to remember certain information such as serial numbers of certain parts and then remember it again later when he uses a computer to find more information. AR interface can be used to display this information immediately saving him the trouble of memorizing the serial parts and allowing him to focus on the job itself. If that was not enough, AR user interfaces also allow the user, in this case the engineer, to move information from one context to another.\n\n3. Minimized attention switches\n\nLet´s get back to the engineer. Without an AR system, the engineer would have to save the serial number, use a different system to find more details. AR system combines the two systems as it displays the relevant information in an overlay.\n\nRemember that we assumed a nicely designed AR User Interface in our example: we stated that the engineer would be able to see useful information about the different parts on his AR overlay. It would not be too hard to imagine a badly designed AR interface that would give the engineer so much information that would confuse him and make searching for required information very difficult.\n\nWe can certainly say that a good UX comes by putting a great deal of attention to the user´ needs and new technologies such as AR open more ways to mess up a design. We are confident that there will be many AR experiences with terrible UX. To prevent that from happening to you, read on about some of the best practices in UX design for AR.\n\n## Best practices\n\nAfter years of lurking in the background, AR has finally stepped out of the shadows and is now revolutionizing the technology mainstream. Products such as Google Glass, Blippar app, and Oculus Rift are already gone viral, and more and more brands are starting for the first time to explore the field of AR.\n\nIn order to ensure that their first step into AR is a success, brands and their UX designers have to watch out for a couple of challenges we mentioned above. To help you succeed, we are bringing you 5 advices on how to develop AR solutions that will enhance the overall user experience and increase your chance for success.\n\n1. Plan first!\n\nBefore you proceed onto coding, you have to plan your experience from top to bottom. Think about the environment and conditions where the experience will be staged. Also, think about how the users will interact with the experience. Here are some possible situations:\n\n– Experiences that involve the user´s whole body, full movement of user´s limbs and/or torso such as Microsoft Kinect or Nintendo Wii.\n\n– Experiences where the user is situated in front of their computer and a webcam, usually sitting down on a distance of 3 feet from the webcam.\n\n– Experiences where the user is standing up or walking while interacting with the environment using their smartphone.\n\n– Experiences where users use wearables such as Google Glass or Oculus Rift. These experiences are personal and usually in a private environment that rely completely on visual and sensory senses.\n\nBy planning ahead and identifying your scenario before doing actual development, you will be able to sort out the design and tech requirements without the need to go back and start all over again.\n\n2. Scout out the location!\n\nDeveloping for AR is (completely) different from building a website. Developing a website consists of following a very generic set of conditions while conditions of an AR experience are very environment-dependent and challenging. By scouting the location and collecting details about the environment, UX designers are able to foolproof the whole process. Determining whether there is sunlight or shadows on the location or whether the experience will be based in an interior or exterior, will help to speed up the whole design process and ensure a better user experience.\n\nMake your designs for small screens first!\n\nMost UX designers have their desks equipped with new 27” Macs with sky-high resolutions. Still, there is a high degree of chance that most of their users will use much smaller screens. This means that viewing the app on a small screen requires clear typefaces that are easy to read. Colors must be high in contrast and have to be positioned in a way that does not the user´s view of their surroundings. This is especially important when designing for wearables. With wearable displays there is much less physical space and the risk of user having eye-strain and fatigue is much greater, especially in the long runs.\n\n4. Don´t challenge your users physically\n\nEye strain is just one way of how a user can get fatigued and regardless of how much your users enjoy your experience, they will get fatigued when they walk around with their hands up holding a device. Also, walking around while staring at a small mobile screen without checking their surroundings is very dangerous – Pokemon Go app warned their users via splash screen that they watch out on their surroundings. Usually, if users are sitting down, they will be able to withstand a higher degree of interaction. This is especially true if their mobile device is held at chest level.\n\n5. FPS is very important\n\nToday´s AR experiences can go as high as 60 frames per second. While great, this level of animation requires a great processing power. Given the wide range of users´ mobile devices, UX designers have to find the golden middle between FPS and animation quality, and mobile devices. By taking the time to optimize the experience before going live, will ensure a better experience no matter the device.\n\n## Conclusion\n\nFor the last couple of years, Augmented Reality has been experiencing a tremendous rise in popularity. Due to considerable advancements in technology and drops in hardware prices, AR is now perceived as a technology of the future and is making its way on the market through numerous applications. AR is already transforming the way we see and learn from our surroundings but now it is starting to do even more – it is revolutionizing companies and their business models. As the definition of AR is quickly moving beyond 2D and 3D overlays over reality to personalized experiences driven by context, AR is starting to combine contextual computing with AI, Big Data, machine learning, and social networks. These interconnections are necessary for delivering relevant and tailor-made experiences and present a huge opportunity for UX professionals that will lead the development of such experiences.\n\nTo conclude, AR will continue to require intensive studying of how humans interact with computers and studies about human body and brain functioning in general. All these studies will help to shape how UX strategy is applied to AR and minimize occurrences where users have to get out of their comfort zone or behave in an unnatural way. While new, AR technology is here to stay and its usefulness in everyday life is increasing each day. As a new method of interaction, AR needs a strong level of understanding of the users, their expectations and needs. This is why it is of utmost importance for UX designers to ensure their experiences are created correctly and that they add value to the user experience."

    "slug": "wireframing-prototyping-techniques",
    "title": "Wireframing & Prototyping Techniques",
    "date": "2017-09-20",
    "author": "Mark Cox",
    "hero": "/images/channel-dynamics-blog-5.jpg",
    "excerpt": "",
    "body": "When designing a new website or application you need to show off your concept to different people to gain their insight. These stakeholders are often end users, investors, media, designers and developers who build the technology.\n\nWhen trying to describe a design to someone, words are useful however they can be miscommunicated and limit people’s ability to imagine how your product will look. The best way to share your idea is to create a wireframe, which people can see however the optimal solution is to build prototypes and wireframes.\n\nThe concept you build may be very different to the final build however wireframing and prototyping are excellent ways to capture the initial idea and get ideas for future builds.\n\nThe difference between wireframing and prototyping is that wireframes are simply a page layout, created to show how the site will be laid out, whereas prototypes are an interactive product people can use to click through a website or application.\n\nWhen your customers see the interactive prototypes you have built, you will be able to tell what you’ll naturally want to build into the product.\n\n## Wireframes\n\nWireframes are divided into lo-fi and hi-fi. Lo-fi wireframes are basic and only feature the most important elements. The project is examined from a global perspective and focuses on crucial factors. This simplified wireframe is best used in the preliminary stages of design and can be drawn using pen and paper.\n\nHi-fi wireframes look like the final product and are most used later on in the phase of design. Focus is on the details of all user elements, rather than a general layout of the page, these wireframes can no longer be created by pen and paper and software is required.\n\n## What are some common mistakes of the mock-ups\n\n1. Don’t start too detailed – Beautifully drawn wireframes are not important at the start. It may be tempting to create a gorgeous design however this will end up slowing you down and takes away from the basic interaction of the site.\n\n2. Stick to the plan – An effective way to stick to a plan is to make preliminary sketches so that you can see a design coming through correctly.\n\n3. Focusing in on the design – If you start to design focussing on size, colour and background then it is too late to design the navigation. Elements in the wireframe are not discussed.\n\n4. Using advance tools for lo-fi wireframes – Programs like Photoshop focus too much on the aesthetics of a prototype and will look better than we needed in lo-fi wireframes.\n\n5. A good prototype is not a finished product – Do not combine a prototype with the final product, they require two different processes to reach their final stage and using the prototype could damage the product.\n\n6. Neglecting clients’ knowledge – Clients should always know the purpose of prototypes, which are shown to them. Explainto them how you got there and what elements are missing. Ask for feedback and what they think is missing.\n\n## What to use\n\nIn the past decade there has been an explosion of inexpensive web tools, widespread conversion from waterfall to agile/lean software development. Tools, which were once previously exclusive to designers and product managers, are now accessible to creators without tech backgrounds.\n\nWireframes can be created with Photoshop, Illustrator or any other design program. At Channel Dynamics we use Sketch as it integrates with our prototyping software, InVision. InVision is the most professional prototyping software allowing you to select areas to swap between screens, appearing as if it is a finished app.\n\n## Channel Dynamics Training\n\nWe are running a wireframing course to provide more in-depth knowledge about the wireframing process. Delegates will learn how and when to use Wireframing, how to test your designs and the techniques required to use wireframing and prototyping tools."

    "slug": "considered-user-research",
    "title": "What should be considered before conducting user research?",
    "date": "2017-03-06",
    "author": "Rebecca Moss",
    "hero": "/images/channel-dynamics-blog-1.jpg",
    "excerpt": "",
    "body": "User research is essential to any web design project, as your users should be the focus of your site design. To make sure the UX of your website is spot on and optimised to give you maximum conversions, it’s important you know your users behaviours and goals.\n\nUser research is part of the initial planning stage, but it also needs some planning of its own. To make sure you get the most relevant data from your research, you need to know exactly what results you need to get and how you plan to use them.\n\n## Quantitative vs qualitative results\n\nTo get the best and most accurate results from your user research, you need to combine both quantitative and qualitative results. It’s important to pre-plan how you intend to conduct your research and what type of results it will give you.\n\nQuantitative research will allow you to collect bulk data that will highlight certain patterns and trends in user behaviour. For example, the number of site users in a month would be classed as quantitative data.\n\nOnce you’ve collected your quantitative results, you can then use qualitative results to drill down further. Once you’ve collected the number of site users in a month (quantitative) you can then take a closer look and find out where those users have come from, how they move around your site and more. This is classed as qualitative data.\n\nDecide how you plan to get both forms of results and how you can use the two together to get a better insight into your site users.\n\nWhat information do you need for your UX design?\n\nWith any research, you need to know what information you are trying to collect from your users. Are you looking to see how site users interact differently with the mobile version of your site rather than desktop? Do you want to know where the best place to put your main CTA is?\n\nPlanning what results you are looking for will help you focus your research, which in turn could save you time and money in the long run. It will also help you create a more effective UX and UI design that is more likely to convert and create revenue.\n\nHow will your user research progress over time?\n\nUser research should always be conducted at the beginning of any web design project, but it shouldn’t end as soon as the site has been designed and pushed live.\n\nPlanning how your user research and insight will progress over time will help you narrow down your initial focus. Everything doesn’t have to be done all in one go and here at Channel Dynamics, we can help with continuing customer insight, helping you identify new user motivations and ever changing behaviours.\n\nAt Channel Dynamics, we can help you with the UX and UI design process right from the beginning. With our user research services, right up to our user testing and evaluation services, we can make sure your UX design is right for your business needs. To find out more about how Channel Dynamics can help you perfect your UX design, get in touch with us today."
   },
   {
    "slug": "how-can-ux-help-with-the-conversion-rates-on-your-financial-services-site",
    "title": "How Can UX help with the conversion rates on your financial services site?",
    "date": "2016-12-08",
    "author": "Rebecca Moss",
    "hero": "/images/channel-dynamics-blog-3.jpg",
    "excerpt": "",
    "body": "The amount of users migrating online to take care of their financial affairs has dramatically increased over the last 10 years. With technology and smartphones evolving so quickly, users are constantly looking for the quickest and easiest ways to perform everyday tasks from the comfort of their own homes, or even on the go.This has meant that UX is now more important than ever, on both desktop and mobile sites. More customers are using their mobile phones for quick and convenient banking, or their laptops for searching for and purchasing insurance, loans and credit cards. Good UX now plays a huge part in boosting conversion rates and a poorly optimised UX could be driving vital business away from your website. So how can you improve the conversion rate of your financial service site and keep customers from looking to your competitors?\n\n## User research\n\nIf you are already seeing a decline in your conversions, conducting user research can help you identify the bottlenecks in your sales funnel.\n\nThere’s plenty of ways to collect UX data, from interviewing to surveying your customers directly. This will help you find out what areas of the site they found difficult or confusing. There are also numerous pieces of software you can use, such as www.makeyoursiteconvert.com, which identifies website conversion issues. This type of software helps show exactly why your site might not be performing as well as it could.\n\nPracticality and Mobile\n\nWhen thinking about the UX of your site, keeping practicality and mobile users in mind are the most important factors.\n\nUsers want to use your site when and where they need to, whether that’s at home, on public transport or at work. This means your site needs to be easy to use and work flawlessly on many devices.\n\nMobile users make up a huge percentage of site visitors and these customers want to conduct their business quickly and efficiently. Make sure your site design allows users to quickly and easily find what they’re looking for and make all CTAs clear and easy to follow.\n\n## Stick with a formula\n\nEvery year there will be new UX trends that will be rolled out across countless different desktop and mobile sites, like the surge in burger menus for example, something that was easy to integrate across both desktop and mobile.\n\nBy conducting competitor research and seeing what UX trends other businesses in your niche are following, you’ll be able to incorporate the same functions into your own site. This ensures continuity, something that can aid customers when visiting your site, as they will already be familiar with a similar interface.\n\n## How UX can aid conversions\n\nStripping back your user experience and simplifying processes can have a huge impact on your conversion rates. Particularly in the financial sector, where everyday customers may already be a little confused or unsure, providing vital information and CTAs clearly will prevent users giving up and heading to your competitors.\n\nHow can Channel Dynamics help?\n\nChannel Dynamics specialise in streamlining your UX and UI, helping you create a site that is user and conversion friendly. Let us help you pinpoint what areas of your site could be improved to better user experience and ultimately increase conversions. Why not give us a call on 020 7112 8884 or get in touch using our booking form to find out how we can help you?"
   },
   {
    "slug": "uxmasterclass",
    "title": "UX Masterclass; How to improve your ROI",
    "date": "2016-09-20",
    "author": "Mark Cox",
    "hero": "/images/channel-dynamics-blog-4.jpg",
    "excerpt": "",
    "body": "We have created a brief UX Masterclass which focuses on 20 things that will show you how to improve your return on investment with UX.\n\nThe UX industry has taken a number of years to grow into something which is widely recognised and businesses now pay great attention to. Without a great user experience customers will not be pleased with your product, even if is fantastic, and will move on to another company.\n\nFor example, when websites began to have the ability to feature complex, interactive features, many companies thought it would be great to create websites which users could personalise and show loads of content all at the same time. However, due to average internet speeds not keeping up with the rate of web development, websites started taking longer to load. Companies which had worked on bringing their customers an interactive website saw their sales fall and their bounce rates increase. What had happened was that the interactive websites had seen an increase in load time which had frustrated customers – Article\n\nAt a basic level, UX design is about addressing the needs and wants of your users and producing products which are a pleasure to use. It is a continuous process as user’s needs are always changing and people evolve their expectations towards technology.\n\nThis needn’t be costly. Norman Nielsen Group, states that observing only five users uncovers about 85% of all usability problems.\n\nHiring an outside UX agency may be the best way to test your product as this can uncover the most common problems. Tests will find any usability issues and explain how to fix them. Most of the time websites fail because they do not focus enough on what the customer wants and needs.\n\n## Why UX is important\n\nIf you are interested in this course then you may be wondering what the benefits are for your business. Improving your site’s user experience will; increase sales, create a website which is easier to manage, engage and increase satisfaction amongst customers."
