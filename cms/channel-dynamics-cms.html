    "body": "The amount of users migrating online to take care of their financial affairs has dramatically increased over the last 10 years. With technology and smartphones evolving so quickly, users are constantly looking for the quickest and easiest ways to perform everyday tasks from the comfort of their own homes, or even on the go.This has meant that UX is now more important than ever, on both desktop and mobile sites. More customers are using their mobile phones for quick and convenient banking, or their laptops for searching for and purchasing insurance, loans and credit cards. Good UX now plays a huge part in boosting conversion rates and a poorly optimised UX could be driving vital business away from your website. So how can you improve the conversion rate of your financial service site and keep customers from looking to your competitors?\n\n## User research\n\nIf you are already seeing a decline in your conversions, conducting user research can help you identify the bottlenecks in your sales funnel.\n\nThere’s plenty of ways to collect UX data, from interviewing to surveying your customers directly. This will help you find out what areas of the site they found difficult or confusing. There are also numerous pieces of software you can use, such as www.makeyoursiteconvert.com, which identifies website conversion issues. This type of software helps show exactly why your site might not be performing as well as it could.\n\nPracticality and Mobile\n\nWhen thinking about the UX of your site, keeping practicality and mobile users in mind are the most important factors.\n\nUsers want to use your site when and where they need to, whether that’s at home, on public transport or at work. This means your site needs to be easy to use and work flawlessly on many devices.\n\nMobile users make up a huge percentage of site visitors and these customers want to conduct their business quickly and efficiently. Make sure your site design allows users to quickly and easily find what they’re looking for and make all CTAs clear and easy to follow.\n\n## Stick with a formula\n\nEvery year there will be new UX trends that will be rolled out across countless different desktop and mobile sites, like the surge in burger menus for example, something that was easy to integrate across both desktop and mobile.\n\nBy conducting competitor research and seeing what UX trends other businesses in your niche are following, you’ll be able to incorporate the same functions into your own site. This ensures continuity, something that can aid customers when visiting your site, as they will already be familiar with a similar interface.\n\n## How UX can aid conversions\n\nStripping back your user experience and simplifying processes can have a huge impact on your conversion rates. Particularly in the financial sector, where everyday customers may already be a little confused or unsure, providing vital information and CTAs clearly will prevent users giving up and heading to your competitors.\n\nHow can Eldingo help?\n\nEldingo specialise in streamlining your UX and UI, helping you create a site that is user and conversion friendly. Let us help you pinpoint what areas of your site could be improved to better user experience and ultimately increase conversions. Why not give us a call on 020 7112 8884 or get in touch using our booking form to find out how we can help you?"
   },
   {
    "slug": "uxmasterclass",
    "title": "UX Masterclass; How to improve your ROI",
    "date": "2016-09-20",
    "author": "Mark Cox",
    "hero": "/images/channel-dynamics-blog-4.jpg",
    "excerpt": "",
    "body": "We have created a brief UX Masterclass which focuses on 20 things that will show you how to improve your return on investment with UX.\n\nThe UX industry has taken a number of years to grow into something which is widely recognised and businesses now pay great attention to. Without a great user experience customers will not be pleased with your product, even if is fantastic, and will move on to another company.\n\nFor example, when websites began to have the ability to feature complex, interactive features, many companies thought it would be great to create websites which users could personalise and show loads of content all at the same time. However, due to average internet speeds not keeping up with the rate of web development, websites started taking longer to load. Companies which had worked on bringing their customers an interactive website saw their sales fall and their bounce rates increase. What had happened was that the interactive websites had seen an increase in load time which had frustrated customers – Article\n\nAt a basic level, UX design is about addressing the needs and wants of your users and producing products which are a pleasure to use. It is a continuous process as user’s needs are always changing and people evolve their expectations towards technology.\n\nThis needn’t be costly. Norman Nielsen Group, states that observing only five users uncovers about 85% of all usability problems.\n\nHiring an outside UX agency may be the best way to test your product as this can uncover the most common problems. Tests will find any usability issues and explain how to fix them. Most of the time websites fail because they do not focus enough on what the customer wants and needs.\n\n## Why UX is important\n\nIf you are interested in this course then you may be wondering what the benefits are for your business. Improving your site’s user experience will; increase sales, create a website which is easier to manage, engage and increase satisfaction amongst customers."
   },
   {
    "slug": "introduction-to-ux",
    "title": "Introduction to UX",
    "date": "2016-09-18",
    "author": "Mark Cox",
    "hero": "/images/channel-dynamics-blog-6-1.jpg",
    "excerpt": "",
    "body": "Most businesses understand what UX is but do not know how to use it specifically in relation to their own business. Since the beginning of the internet, websites have improved to allow more functionality and faster load times. What was once a static experience is now an interactive one. With customers so used to the internet, having a website which is not a pleasure to use will cost your business dearly.\n\nWe are running a two-day training course to get you up to date with the world of UX and how you can apply this to your business. For a brief on the course please click this link however this post will cover the course in a bit more detail.\n\n## Usability\n\nIn a previous blog post we discussed usability in terms of UX design but during the course we will discuss usability from the (ISO 9241) and explain how to reach industry-standard. The ISO 9241 is a multi-part standard covering human-computer interaction and has many parts to do with website design.\n\nWe also discuss how we can then quantify and compare two-designs’ usability.\n\nWith data driven sites and continuous research in the area, understanding the motivations of users has never been easier. The course covers these findings and shows the implications of first impressions, duration of visit, scrolling, screen resolutions and viewing and reading patterns.\n\nIf you are a web designer you will already have design skills, however we will show some basic design principles that should be considered, including consistency, using design to communicate ideas and Calls-to-Action.\n\nUsability guidelines are a series of considerations for the home page, error messages, on-site search, campaign landing pages and forms. The government has created some guidelines, otherwise known as the Government Design Principles. These 7 digital principles list some of the basics for creating great user experiences.\n\nThe design of these pages is important so that long load times are not too high. People say that one of the biggest problems of most commercial sites is when a site takes to long to load – Article\n\nThe techniques used in user experience design are; running usability tests, creating customer journey maps, understanding the information architecture of a site and creating wireframes and prototypes.\n\nUser experience design originates from user-centred design. User-centred design is where the service the user is presented with matches the needs and wants at every stage.\n\nIn recent years the internet has not be constrained to desktops and laptops but is now on smartphones and tablets on a variety of different browsers and connection types. This is why UX takes a look at all the ways a website could be accessed. This takes into account accessibility issues such as people with special requirements or those who use non-traditional input devices. For example, using sliders on your website should be avoided as it can de difficult for people who can’t drag very precisely.\n\nSaying every company can benefit from examining their user experience is true however there are some cases where this is more true than others. Complex sites need UX work especially in areas of information architecture and customer journey mapping. A site which does not have specific information architecture will find it hard when updating the site thinking of where to put content and a site without a clear customer journey map may confuse customer by not having sections where they believe they should be.\n\nStart-ups should also focus on creating a solid user experience for its first iteration. This will attract user’s attention and make them stay with the product as it improves.\n\n## The Limitations of UX\n\nUX design will not work for every user because all users are different. A successful design for one person might have the opposite effect on another. What designers can hope to do is promote certain behaviours from the user to improve use of the site.\n\nEach website will require different experiences so the cost of running user experience tests will vary widely. If you are getting outside help for your site it is best to ask for a quote.\n\nAnother problem which might upset your boss is that it cannot be assessed via traditional metrics. Even though google analytics can compare two different designs with page views, bounce rates and conversion rates, unless you ask you will not be able to tell the user’s experience.\n\nAt Eldingo we have a range of UX tools and established processes that we can use to tackle your problem. If you have a concept or idea that you would like to bring to life, we can help. We can audit what you have through content audits or expert usability reviews of your website. We can help you design your information architecture (IA), customer journeys and page templates or can user test these with live customers in our in house labs in central London.\n\nIf however you are thinking of setting up your own UX department then we can help. Join us on our two day training course."
   },
   {
    "slug": "understanding-user-needs-customer-journey-maps",
    "title": "Understanding User Needs with Customer Journey Maps",
    "date": "2016-09-18",
    "author": "Mark Cox",
    "hero": "/images/channel-dynamics-blog-7.jpg",
    "excerpt": "",
    "body": "Understanding the needs and motivations of your customers is crucial in improving your sites user experience. This not only benefits the customer but also your business with an increase in repeat sales. Most websites have a specific feature that they want customers to interact with however, but the question remains, how do you get customers where you want them on your site.\n\nCustomer Journey Maps are used for identifying customer needs through storytelling and visualisation methods and can be used to help your customers achieve their goals from visiting your site.\n\nAnalytics programs often provide data which can be used to improve services however using customer journey maps allow for the thoughts, feelings and frustrations of the customer to be brought to focus.\n\nIf you have already used customer journey maps then you know they can be incredibly complicated, even though they are worth making.\n\nThe more times you utilise customer journey mapping in your projects the more you will come to learn its mechanics and better understand your customers.\n\nHere are some tips for using customer journey maps:\n\n1. Define the stages\n\nAs all businesses are different the stages users go through whilst using your site will be different. The stages can be created by looking at your Personas to get a good idea about the process your customers go through from their landing page to what they want from the website. Some popular ones include information gathering, journey to purchase and final purchase.\n\n2. Align the Customers with stages\n\nThink about what your customers want from the site as they move through the stages; you’ll then be able to see if your website has the information needed to support these goals.\n\nThe types of data you can use to understand goals are survey answers, user-testing feedback, interview transcripts and customer service emails and support transcripts.\n\n3. Identify Touchpoints\n\nFrom the different stages identified think of the ways in which you interact and engage with your customer. Think of the customer needs and where, in each stage of the process, they can be met.\n\n## The Outcome of a successful Customer Journey map\n\nCustomer Journey Maps can help your business decide what the main business goal you should be focussing on. This is because priority can be given to tasks which will improve the customer flow.\n\nIt can also be used to focus different teams to achieve customer experience. This means everyone knows what the customer is asking for.\n\n## The Course\n\nIf you are interested in more detail about Customer Journey Mapping then we run a course on all the features of a customer journey map and how to apply it to your business.\n\nThe course includes an introduction to Customer Journey Mapping, personas, user scenarios, the process of Customer Journey Mapping, mapping the ideal customer journey and the final product.\n\nWe can also run training in-house, For more details on the different courses, please click the link below."
   },
   {
    "slug": "tips-improving-websites-information-architecture",
    "title": "Tips for Improving your Website’s Information Architecture",
    "date": "2016-09-13",
    "author": "Mark Cox",
    "hero": "/images/channel-dynamics-blog-8.jpg",
    "excerpt": "",
    "body": "Last month’s newsletter mentioned information architecture but not the ways to improve it. To re-cap Information Architecture is the way in which information environments are designed for online communities and how software is used to support usability and findability. This is an often-overlooked feature even though it affects the way users interact with your site.\n\nThis blog will cover the card sorting technique in information architecture.\n\n## Organising your Site\n\nOrganising content can be difficult and thinking of how to group posts can be impossible without knowing what your customers want. For example where should the FAQs be on the website?\n\nWhen designing the layout of your site it is important to think about how to make it easier for customers, especially for e-commerce sites, as this will lead to more purchases and users will be able to find your products easily.\n\n## Card sorting\n\nis a method used in the design and evaluation of information architecture of a site. It involves participants putting topics they feel go together into distinct categories. The result is a layout for your site which users have told you they find the easiest.\n\nA successful card sort will improve the labelling, grouping and organisation of information.\n\nCard sorting sessions are classified in one of two ways – open or closed. Open card sorts is the more flexible of the two; users are free to organise cards you supply into groups that make sense to them whereas closed card sorts are where participants sort topics into pre-defined categories.\n\nIf you were doing an in-depth card sort then using a combination of the two different card sorts would be the best way.\n\nMost sessions will be one on one with an observer. Participants think aloud while sorting to give a clearer picture of their reactions and thought processes.\n\n## Conducting the card sort\n\nCreate a list of content topics that are on your site or if designing for a new site, will be content topics. The next step is to decide whether to do the card-sort face-to-face or using online card-sorting software.\n\nSet-up the session: a good estimate is an hour long however it may take longer if you have many cards. The sessions must be with a facilitator to make notes as the participant does the task.\n\nTo start, state the aims of the session and show the participants the cards. Explainto them how the session will work based on whether it is an open or closed card sort.\n\nMake sure whilst they are card sorting that they are thinking out loud, you want to understand the participant’s motives for putting some categories.\n\nIf at the end there are still too many groups of cards, ask the participant if some groups could be combined.\n\n## Analysing the card sorts\n\nTo analyse the data from both the qualitative and quantitative side make a list of the participant’s thoughts and how often cards appear in specific categories.\n\nThe result of this is to pull together the findings in a report to share with a team and stakeholders.\n\nOne tip is to allow participants to rename the cards or even make their own suggestions for new ones. This will show you if you have missed out any part of the process which the user thinks is important.\n\n## How Eldingo can help\n\nEldingo runs Information Architecture UX training course which will improve your techniques for evaluating information architecture. The course features an introduction to information architecture, card sorting, finding and recruiting participants, face-to-face and online card sorts, how to analyse the card sorts and how best to present findings in a report."
   },
   {
    "slug": "managing-large-content-sites-better-user-experience",
    "title": "Managing Large Content Sites for better User Experience",
    "date": "2016-08-02",
    "author": "Mark Cox",
    "hero": "/images/channel-dynamics-blog-9.jpg",
    "excerpt": "",
    "body": "If your website has a lot of content, it can be difficult to decide how best to present it to your users. Designers of sites like Amazon and GOV.UK have spent years perfecting their user journeys so that content is easily accessible from any page on the site.\n\nIt is difficult to decide between having information behind multiple organised menus or potentially overwhelming your users with too much information on their landing page. Overloading your users with information will reduce their engagement with the site and make it difficult to hold their attention. Getting it right, however, will increase your site’s usability and keep your users coming back for more!\n\nIn this article some UX techniques will be discussed that can help improve the structure of an information-heavy website.\n\n1) White space – or alternatively negative space is the portion of the page left blank between images, text and other elements. Even though it is called white space it can be any colour to fit a previous design as long as it doesn’t contain text, images or any other elements. Making use of white space means your content is not everywhere all at the same time, allowing the reader’s eyes rest.\n\n2) Meaningful grouping – when deciding how to give your users access to content, it is important to show it to them it in meaningful groups. This can be done by putting content in distinct visual categories and keeping it in a consistent alignment in order to reduce the mental effort required to process the content.\n\n3) Search – having a search feature on your website immediately makes it more user-friendly, as users can simply search for what they need using keywords. If your search does not, however, result in the display of intelligible results, then this will reduce the site’s usability and increase frustration with the site.\n\n4) Information architecture – deciding on the terminology and importance of different types of content will help before creating the layout of your site.\n\n5) Visual hierarchy – after deciding on what content is most important it can be visually shown to users. The relative importance can be implied by size, placement and headings.\n\nNow that we’ve gone through the basics here are some examples for each technique.\n\n1) White space: A structured and clean website design allows the content to come through by itself – Google is a good example. Proximity suggests to users certain links have similar function. The less you have on a site the more meaningful the stuff you do have will be. Dmitry Fadeyev found that white space between paragraphs in margins on websites improved comprehension by almost 20 percent online.\n\n2) Meaningful grouping: A site which may have different design styles on different pages can still remain consistent with grouping in how it displays content.\n\n3) Information hierarchy: Excerpts which summarise your content help users understand where they are looking, thereby increasing usability.  Even content which is large in size must be carefully edited to allow for easily digestible paragraphs.\n\n4) Visual hierarchy: Bigger content is more noticeable, this is one of the simplest ways to explainto your users that they should take notice of it. Understanding some simple colour psychology will help you create content human eyes are naturally drawn to. Our eyes naturally gravitate towards the centre of a screen however links should be at the side as it is easy to throw a mouse to different corners of a screen.\n\n5) Search: Real-time searches allow users to see easily what the website offers.\n\nEldingo can help by examining your site, creating information architecture, creating and testing prototypes and suggesting the best structure for your site. Or take one of our training courses to set you and your team up for successful testing in-house."
   },
   {
    "slug": "hidden-navigation",
    "title": "Hidden Navigation and User Experience",
    "date": "2016-08-02",
    "author": "Mark Cox",
    "hero": "/images/channel-dynamics-blog-10.jpg",
    "excerpt": "",
    "body": "Hidden and Hamburger menus became popular with the increased importance of designing better interfaces for smartphones and tablets. Since 2015, the most popular device for connecting to the Internet in the UK is the smartphone; responsible for a third of Internet access.\n\nNot only are people using their smartphones more but they are willing to make purchases on their smartphone. Monetate, a large marketing company, published their conversion rates for their retail over two years. In Q4 of 2014 the conversion rate for smartphones was only 1.94% but in Q4 of 2015 the conversion rate was 3.05%.\n\nThe benefits of using hidden navigation are that designers can create a website which will work across different devices and removing a fixed menu bar means a website isn’t cluttered and allows content to be adjusted in the future.\n\nUnfortunately, recent usability tests by Nielsen Norman Group of Hidden and Hamburger menus on desktop sites have found that discoverability of a site is reduced when global navigation is hidden. This results in an increase in the time it takes for users to complete navigation tasks on a site and they rate site navigation as more difficult.\n\nHere are some ways in which you can determine whether hidden navigation is right for your site.\n\n1) Google Analytics. Google’s In-page analytics allow you to see the percentage of clicks to certain links. This can be used to see if a traditional fixed global menu or hidden global navigation helps your users find what they are looking for.\n\n2) User testing. Alongside your analytics get users in and record how they navigate your website. You are looking for if they use hidden global navigation or rely heavily on local navigation and search features.\n\n3) Bounce rates. Compare the bounce rates of your site before adding hidden global navigation to see if the lack of visible global navigation means people are less willing to view the rest of your site.\n\n4) Order amount. If after implementing a hidden global menu your order sizes decrease this could be due to users not being able to find other products on your site.\n\n5) Feedback. Place a feedback link on every page and encourage users to fill it in if they have issues navigating the site. This will let you know if your content has reduced discoverability.\n\nAs the use of hidden global navigation increases this should improve most users understanding of how they work.\n\nLike most web design, deciding on whether hidden global navigation helps or hinders your site is down to your users, how they use your site and how you want to display your content. Analytics and research can help you prove quantifiably which kind of navigation works better.\n\nEldingo can help by performing user research, using analytics to reduce bounce and suggesting the best structure for your site. Or take one of our training courses to set you and your team up for successful testing in-house."
   },
   {
    "slug": "infinite-scrolling",
    "title": "Usability of Infinite Scrolling",
    "date": "2016-08-02",
    "author": "Mark Cox",
    "hero": "/images/channel-dynamics-blog-2.jpg",
    "excerpt": "",
    "body": "Have you ever found yourself spending way more time than you expected on Twitter, lured by more and more boredom-fighting tweets? If so, you’ve experienced the appeal of the Infinite Scroll. This technique became popular several years ago and was very common for a while. Many sites still use it. As it’s past the point of being a trend, now is a good time to look at this style to see where and when it might be useful.\n\nOne of the reasons infinite scroll didn’t become more popular is that there are several usability problems with it:\n\n1) Lost Footer – many users rely on links in the footer to find parts of the site that may not be easily findable in the top level navigation – such as how to find us, or careers. Without a footer as a fall back your top level navigation needs to work harder and requires careful consideration of navigational priorities.\n\n2) Lost Users – its difficult for a user to have a sense of where they are on an infinitely scrolling page. User research over the last few years has shown that people need to be in control of their browsing experience. They want to know where they’ve been, and how much there is to see so that they can decide if it’s worthwhile to continue. While continuous scrolling can be engaging, it can also be a hinderance to a user who is trying to perform a task or find something specific.\n\n3) Load time – depending on how your site is built, load time is more likely to be an issue with an infinitely scrolling page.\n\nThere are, however cases where infinite scroll can be effective:\n\n1) Where your content is mostly graphics. People process images much more quickly than text, so scrolling through large numbers of images is less work then the equivalent number of text items. This is why Google uses infinite scroll for its Image search, but traditional pagination for its other results.\n\n2) Where your users are browsers not seekers. Infinite scroll provides an easy browsing experience and the chance to discover new content with just a simple gesture.\n\n3) Where your content is constantly updating. If your content can take the form of a constantly updating timeline, then an infinite scroll can be a meaningful representation of your content – see Twitter, or Pinterest.\n\nSo is infinite scroll a good choice for a content-heavy site?\n\nProbably not for most, but a compromise model may be a better choice. Many media sites have opted for very long pages where scrolling is required, but where it also has an end. On sites like Squarespace and the BBC you can clearly see the wide range of content, but you can also eventually reach a footer, and easily find your way back up to something you might want to read.\n\nIn any case, user research is key to identifying what will work best for your site visitors. You need to find out how they want to approach your content, and what style will assist them best.\n\nEldingo can help by performing user research, testing prototypes, and suggesting the best structure for your site. Or take one of our training courses to set you and your team up for successful testing in-house."
   },
   {
    "slug": "tabbed-navigation",
    "title": "UX Design for Tabbed Navigation",
    "date": "2016-08-02",
    "author": "Mark Cox",
    "hero": "/images/channel-dynamics-blog-11.jpg",
    "excerpt": "",
    "body": "Imagine entering a website like you would a shop in real life. To navigate around the store you would need information to help direct you where to go. In supermarkets they have large signs above aisles to show you where products are located. This idea can be applied to website design to improve your sites’ user experience as tabbed navigation at the top of the page can be used to let your users know where content lies. These are known as in-page tabs and are the type which are built into the website’s design, generally in the header.\n\nTabbed navigation is popular as users of websites are more often than not coming from Google to a particular page on your site and tabs allow them to see what content your website offers without having to go to a homepage.\n\nWhen designing a web page with tabs it is necessary to go through a quick checklist in your head.\n\n1) Does my user need to view certain content on a page simultaneously?\n\n2) Are my tab names nonsensical and too long?\n\n3) Are the amount of tabs I need unwieldy?\n\nIf you answered yes to any of those questions then tab design may not be right for your website. However for the rest, here are some tips on best practice for tabbed navigation.\n\n## Golden Rules\n\n1) Tab names must be logically labelled. Users must know what content to expect when they click on a tab. They must also be short – usually 1 or 2 words – as these short labels are more scannable for the reader. One way to test if your tab names make sense is to review your site’s information architecture with users so that they can tell you what they predict will be in any given tab.\n\n2) Tabs must only be used when users don’t have to see both tabs simultaneously. If someone is comparing two products on your site or if for an event the time, date and price for admission are all on separate tabs this will increase their frustration with the site and will put unnecessary load on their short-term memory, thereby lowering usability of the site.\n\n3) The open tab must be highlighted so users know which tab they are in. A simple enough rule, but it is often thrown out in favour of sleeker UI design. The same issue can arise if the highlighted tab is not noticeable enough.\n\n4) Use the same design for your tab as the open content area. This includes colours, typography and in parallel with other tabs to help tell the user, which tab is currently open.\n\n5) Tabs must be placed on top of a website – not on the sides or down at the bottom as users will often overlook those areas.\n\n## Summary\n\nAs tab use becomes more popular users will start to develop a schema on how to interact with a website that has tabs, so it is important to design with the fundamentals in place.\n\nUser research and information architecture will assist you when thinking about how best to lay out your website. You need to find out how users want to view your content and what route you should create to assist users in accessing that content.\n\nEldingo can help by performing user research, testing prototypes, and suggesting the best structure for your site. Or take one of our training courses to set you and your team up for successful testing in-house."
   },
   {
    "slug": "content-strategy-ux",
    "title": "Content Strategy and UX",
    "date": "2016-08-02",
    "author": "Mark Cox",
    "hero": "/images/channel-dynamics-blog-12.jpg",
    "excerpt": "",
    "body": "Users come to your website looking for content. They don’t really care about how pixel perfect your layout is or how it was made, so long as it grants them access to great content. ‘Content is king’ said Gates in 1996 referring to how he believed success on the internet would come from the content offered by websites, not from the manufacturers of computers and internet suppliers. This is why it is important to have a ‘content strategy’ to plan how and when you are going to release your content.\n\nThe term content strategy refers to content creation, delivery and management of content. It has been common in web development since the late 1990s and some large organisations may hire or contract content strategists to help them with this.\n\nThe Content Marketing Institute (CMI) in April 2016 found that almost two thirds of companies don’t have any form of content strategy. This may apply to you as you may think content is not as important as the business plan or the product, however the 75% most effective teams do document their content strategy (CMI).\n\nIn recent years user experience designers have moved away from simply thinking about the design of a website to working with content creators as the images, text and layout of the content affects the overall user experience.\n\nHere are some of the reasons why creating a content strategy can help design a great user experience.\n\n1) Make content easy to scan – with the increased ubiquity of the web, users are consuming information in different ways than before – they skim and replace words. This means most users welcome content that can be understood in a glance.\n\nThis doesn’t necessarily mean making articles shorter but make it a pleasure to read and be understandable. Designers should make sure there is a clear structure with appropriate headers and support.\n\n2) Create information architecture – organise content so that it makes sense when accessed by the user. This can then be created by emphasising how the content should look on a particular page. When content is laid out properly it will improve user comprehension.\n\n3) User personas – as with most UX ventures, keeping users at the forefront of your mind when creating content will improve its success. Before creating content it is useful to create user personas to understand what types of people are looking for your site’s content.\n\n4) Conversion rates – if your business relies on e-commerce sales then a smooth user experience will mean it is more likely for conversions to increase. With a clear content strategy keywords can be used to target customers and content can be created for these users. One-way of doing this is to get your customers in and ask them questions to understand what they would like in each section of the purchasing process.\n\nYou may already do all the things mentioned above but having a strategy will help with delivering a steady supply of good content. Fantastically designed websites are nothing without good content and without a plan can be let down with content delays. A content strategy can address these problems and can be used to measure the success of content.\n\nWhen content is released on your site the main aims should be to maximise your reach and commercial gain. With importance placed on every bit of content you release it will force you to make the best content possible and make your designers think about how to best layout the content.\n\nEldingo can help create a content strategy with you by assessing what your business is trying to achieve, creating measurable success milestones, performing user research and suggesting the best structure for your site. Or take one of our training courses to set you and your team up for successful testing in-house."
   },
   {
    "slug": "6-tips-designing-content-heavy-websites",
    "title": "6 Tips for Designing Content-Heavy Websites",
    "date": "2016-06-29",
    "author": "Rebecca Moss",
    "hero": "/images/channel-dynamics-blog-13.jpg",
    "excerpt": "",
    "body": "Minimalist sites may be trendy, but some sites simply can’t and shouldn’t attempt this style. A site with a lot of content can still be appealing and engaging. Here are some tips for getting it right.\n\n1. Start with a content audit. If you’re migrating or upgrading a site, ensure that the content you’re planning for really needs to be there. Update, rewrite, or delete as needed. Even on a new site, you’ll need to know as much as possible about the extent of the content the site will hold in order to plan for it. And a good content audit is an important reference as you develop your information architecture\n\n2. Plan your information architecture. Content-heavy sites more than any other need good information architecture to ensure visitors can can search and browse without getting lost. First, identify your content types and how they relate to each other. Then think through the site navigation and how the different content types will fit together on each page.\n\n3. Show a clear information hierarchy. Careful grouping and positioning of content on your pages will enable visitors to get the gist of a page with a quick scan. Headlines, subheads and teaser text should be clear and descriptive, avoiding jargon. Typography matters a lot here, so choose a typeface with enough variations to convey the different content types or choose contrasting typefaces suited to your overall design. Use a minimum set of page templates to ensure consistency throughout the site.\n\n4. Use progressive disclosure. Hint and reveal your content in menus, teaser text, or expanding text. This makes scanning easier and also invites browsing, discovery and greater engagement with your site.\n\n5. Minimise pagination. Keeping articles to a single page, even a long one makes them easier to read, and more likely to be read to the end.\n\n6. Don’t lose your navigation. Use floating menus to ensure ease of navigation even on long pages.\n\nThe content on your website represents a significant collective effort by your contributors. When your user experience lives up to the quality of the content it delivers you’ll engage your visitors and enhance your brand.\n\nDo you need help with your site? Contact us at hello@usio.com. Share your experiences of designing content-heaving sites with us on twitter @usiolondon."
   },
   {
    "slug": "simplify-forms-user-journeys",
    "title": "How to simplify forms and customer journeys",
    "date": "2016-02-16",
    "author": "Rebecca Moss",
    "hero": "/images/channel-dynamics-blog-2.jpg",
    "excerpt": "",
    "body": "Contact forms and booking forms can be the main source of conversion and digital revenue stream for your businesses site. If you don’t have an ecommerce site allowing customers to purchase products or services directly through your site, then a form may be the main contact for your user base. In this case, it is important to make sure your forms are simple and easy for your users to use. Complicated forms and convoluted user journeys could be a make or break factor for your website.\n\n## Keep your main user base in mind\n\nRecently the OECD group conducted a study into user competence. They showed that over 40% of the working population only possess rudimentary computer skills. Your own user pool may have less skills, as this study didn’t include people over the age of 65. The computer literacy of your users is something that needs to be accounted for if you want to maximise your conversions.\n\nThere are steps you can take to streamline your webforms. Too often we see forms and user journeys that are convoluted, ugly or plain confusing. Clear and simple forms increase conversion rates. A high conversion rates mean higher takings and increased buzz around your business.\n\n## Make your form the main focus\n\nIt’s important to limit objects on the same page as your form. A sparse page, with clear input boxes, gently directs the user towards them. Using additional guides like arrow icons or contrasting colours will make this even clearer. You are coaxing the reader through the form and a lack of clarity can turn people off immediately.\n\nYou also need to make your call-to-action button stand out. A stock ‘submit’ button will not help your conversion rates. Instead, tell users what happens after they click the button. ‘Sign me up!’ or ‘Start your Free Trial!’ is stronger because there is more clarity and direction to your page. In addition to this, the size of your button is instrumental, allowing users to clearly see what is required of them.\n\n## Polish your UI and UX design\n\nThe use of an established UI pattern is wise. The pattern itself will depend on the nature of your website. The natural language form uses conversational style to narrow down options and add a lighthearted feel. This UI pattern can be seen on Airbnb and Kickstarter so has connotations of young and vibrant businesses. Other UI patterns that could come in handy are wizards guiding the user through each step and the use of a completion bar to track progress.\n\n## Don’t be afraid to continuously test your UI design\n\nUsing A/B testing will help you identify problems with your layout. You can find out what colours or button titles work and where your form falls flat. Performing regular testing can show weaknesses and allow the optimum success rate. It’s important to thoroughly investigate your shortcomings so that you can learn how to move forward.\n\nThrough having a minimal and clear form and the intelligent use of UI patterns, you can work to engineer a webform that carries your users through. This will help you increase conversions and serve the needs of as many customers as possible. Constant user testing and evaluation can help to discover what your users truly think about your forms – the Eldingo user testing and evaluation service can be the springboard to help change and improve the overall digital performance and conversion of your forms."
   },
   {
    "slug": "top-10-mistakes-in-information-architecture-ia",
    "title": "Top 10 Mistakes In Information Architecture (IA)",
    "date": "2016-01-06",
    "author": "Rebecca Moss",
    "hero": "/images/channel-dynamics-blog-14.jpg",
    "excerpt": "",
    "body": "Information architecture (IA) is the structural design of shared information surroundings; the science and logic of how to organise and label webpages, intranets, social networks, and software products to support usability and findability. Bad information architecture is also a number one cause of user task failures. To find out why, we have investigated 10 major mistakes in IA that cost businesses lots of money each year. We have divided these mistakes into two key areas; structural and navigation mistakes.\n\n## Structural Mistakes\n\nLack of structure One of the most significant structural problems is making a website with no organizing principles. This mistake is most common on news sites and e-commerce websites where each item is a stand-alone product with no connections to similar items. When a website lacks organizational principles users tend to leave the site very quickly.\n\n## Missing landing pages\n\nIt is highly recommended that your site has its own landing page from which visitors can access the rest of your site. Equally, the sections of your site which users can visit from the main landing page should also have a subsequent category page that offers users another clear selection of options to find the content they want. Doing this may result in having more pages to map but it does make your site far easier for users and means that no important information on your product or service is missed.\n\nCategory pages can also help your SEO because they are the landing place when people search for your product. They’re also a good way to avoid mistake number 3.\n\n## Not integrating structure with search\n\nVisiting a page from a search engine is like dropping into a place you do not know. It can be easy to get lost. Local navigation can help you find your way around but it will work only if the site has a good structure. Search engines like Google will not always be able to expose specific pages within the site structure because they don’t know the page structure or which navigational dimensions are important for common site tasks.\n\nIt is an unfortunate fact that search and navigation fail to interact completely on many websites. This problem is increased by navigation designs that do not show where the user is currently located because after they click a search result, they can’t find out exactly where the user has gone.\n\n## Polyhierarchy\n\nOne of the many benefits of the digital world is that a single product can be sold from many different locations at once. Websites can sort products and other services using multiple dimensions as this can help users to easily find related items. This is great, but polyhierarchy can easily become a big issue. With too many classification options and too many dimensions, users are required to think hard about what they are doing before moving forward.\n\n## Subsites not Integrated with Main Page\n\nUsing a dedicated micro site might have been a great idea back when you released a new service or a product, but it will soon undermine your online strategy and hurt your online presence. For example, on both micro sites and subsites, you can often find product-specific pages that fail to link to information about your company.\n\nThe best approach would be to abandon micro sites completely and place new product information on your subsites inside the main page.\n\nNavigational Mistakes\n\n## Navigation Options cannot be found\n\nThe greatest navigation mistake is to have no visible navigation options. Thankfully this mistake is so rare that we only need to discuss it briefly. Invisible navigation and navigation that is difficult to find is basically the same thing as having no navigation at all.\n\nAlways make your navigation visible.\n\n## Navigation Elements that can´t be controlled\n\nUsing moving elements on your site can reduce your Web usability. Users should focus on your products and services and not about how to manipulate the website´s interface. Sensitive rollovers and page elements that spin and move are two of the main sources of user complaints when looking at a site. Do not underestimate the effect these two offenders can have on your users.\n\n## Inconsistent Navigation\n\nNavigation is there to help your users, not to make their life difficult. Users should be able to understand it immediately, and apply that understanding throughout your site. Many website owners change their navigation regularly which makes their users feel like they are losing control.\n\nGlobal navigation can act as a very important element that will help users understand where they are and how they can easily return to the top of the site.\n\n## Large numbers of Navigation Techniques\n\nAll navigation techniques have their own set of usability advantages and disadvantages but one thing is certain: each technique is only effective if used on its own. If you use them all at once, you will get only the disadvantages of the navigation techniques you implement.\n\nMade-Up Options on the Menu While this mistake was very common in the past, we can still see many sites that continue to make up their own words for navigation items. These made-up terms also hurt search rankings because users cannot find a product if they don’t know what you have named it.\n\nOld words are better as they are simpler. If users don’t understand your website, they’re less likely to make a purchase or interact in the way you want.\n\nBy understanding the common mistakes you can make in UI design you will be able to maximize the potential of your site and improve the UX for everyone who visits your site. If you want to know more about the best ways to design a site that suits users then you should take a look at our post about the things every UX design agency should know about people.\n\nAre there any common mistakes you see happening frequently on other people’s websites? Or are there some tips and tricks you can offer to help resolve these frequent mistakes? Let us know on Twitter and make sure you follow us while you’re there @EldingoLondon."
   },
   {
    "slug": "the-top-10-pitfalls-of-web-design-that-you-should-avoid",
    "title": "The Top 10 Pitfalls of Web Design That You Should Avoid",
    "date": "2015-12-30",
    "author": "Rebecca Moss",
    "hero": "/images/channel-dynamics-blog-15.jpg",
    "excerpt": "",
    "body": "Everyone who uses the internet has a list of things they hate to see when they visit any website. While there is a vast amount of information on how to create a great website that can be easily found, it seems incredible that some web designers still insist on using the elements that will make every visitor click the back button instantly with the intention of never visiting that site ever again.\n\nEvery year, big-name websites are drawing up the list of the top 10 worst things in web design that everyone should avoid because they bring more harm than good. And each year, the Internet is flooded with new websites that make the same old mistakes. After conducting extensive research among website visitors, here is our list of the top 10 mistakes in web design:\n\n## Using Pop-up Ads\n\nIf you think that Pop-ups are a great idea to advertise, please type in your search engine “I hate pop-ups” or simply visit this link. There are tens of millions of articles and surveys that say the same thing: visitors hate Pop-ups. What is surprising is the fact that some designers still believe that bombing a visitor with Pop-ups is a great way to increase sales. In fact, the only thing that Pop-ups increase is the blood pressure of your, soon to be ex, visitors.\n\n## Animated Flash pages\n\nOk, let´s assume that most people come to your website looking for information about a product or a service that you offer. Why would you want to “attack” them with flash animation instead of giving them the information that they need? Research has shown that you have as low as 10 seconds to provoke interest in your visitor that will make them stay away from the “close tab” button. Why spend that time on animations that are irrelevant and require high-memory usage? High-speed Internet is everywhere, but there are still some visitors who have slow connections and spending 5 minutes to wait for your website to load is not an option for them.\n\n## Horizontal scrolling\n\nIf the text on a website demands scrolling left and right in order to read the entire line, it comes as a result of one specific thing: bad design. We were certain that this mistake was a thing of the past. Apparently, it is not.\n\n## Long load time\n\nSlow loading time is one of the biggest problems of most commercial sites. When customers browse the contents of the pages looking for a product that they are ready to buy, waiting for a page to load can sometimes seem like an eternity. Many visitors at this time lose their nerves and just go to an alternative site, often your competitor’s one. Common causes of this problem are low-quality web hosting, too many graphics, non-optimized graphics and bad coding. Find the problem and solve it, or find someone who can.\n\n## Banner overload\n\nOccasionally users might encounter a commercial website with 20 banners. OK, congratulations on your collaboration with so many other sites but a limit must exist. It probably isn’t your intention to confuse your visitors but using banners in this way will never leave the impression of professionalism.\n\n## Bad grammar\n\nDo you know the difference between “their” and “they´re”? Most people know the difference mainly because it is essential grammar and because of the fact that mistakes like this tend to go viral on social networks. Why risk losing your reputation and professionalism over some typos?\n\n## Animated movable objects\n\n“Cool” flash banners and dancing graphics could seem like a great approach if your visitors are 8-years old. However, when everybody is talking about premium and quality content, it is obvious that visitors want websites that aren’t full of this type of visuals.\n\n## Background music\n\nWe are sure that you have an excellent taste in music. But we are even more sure that there are those who do not share your taste. Visitors in most cases do not expect and do not want music to auto-play on a website. It is also worth noting that background music is also a heavy-loader, consumes bandwidth, and the player can be a significant burden on older computers.\n\n## No contact info or outdated info\n\nYour visitor is searching all over your website and is ready to contact you to make a purchase but there is no contact form. Or even worse, you have changed the phone number but the old one is still present on your website. Visitors need to have some way to contact you easily, even if it is simply an email address.\n\n## No navigation support\n\nNever assume that your visitors are aware of technical design or that they know your website as well as you do. Most of your visitors are newcomers and they will have difficulty finding information if there is no navigation support. Inserting a site map is not a difficult process but it can prove very helpful to your visitors.\n\nWe hope that your website will never fall into these pitfalls that can do easily ruin a user’s experience. It is amazing to know how often these mistakes are made by designers and how sites that could be effective and interesting are suffering just because of simple mistakes that are easy to resolve. If you want to know more about effective UX then we suggest you take a look at our post on the benefits of user centred design.\n\nIf many of these issues sound familiar or you have found some of the worst web offenders online then get in contact and let us know on Twitter at @EldingoLondon and make sure you follow us for more UI and UX tips while you are there."
   },
   {
    "slug": "how-to-optimize-your-screen-for-mobile-usage",
    "title": "How To Optimize Your Screen For Mobile Usage",
    "date": "2015-12-17",
    "author": "Rebecca Moss",
    "hero": "/images/channel-dynamics-blog-16.jpg",
    "excerpt": "",
    "body": "Digital marketing is one of the most important things for building a brand. It is the key to effectively selling your product or service. However, as mobile usage has grown in virtually every aspect of the internet it has also affected the way that people create, and optimise, content so that they can show it effectively on mobile devices.\n\nStill, many companies are failing to adapt to this changing user behavior. According to research studies that were conducted on the subject, only one-quarter of businesses optimize their website for mobile screens.\n\nA major challenge to mobile content optimization is a lack of mobile screen standards. To those experienced in standard HTML design, this does not come as a surprise. HTML remains a journey back in the past, all to the early days of web development. Layouts must be arranged with tables due to the outdated HTML rendering engines of some web browsers, and CSS must be done inline as many web browsers completely disregard all style declarations made in thesection of the page. But this does not mean that there are not at least some advisable practices for getting your content viewed on mobile devices.\n\nBefore planning, writing, designing, or publishing your next webpage update or content, review the following considerations for design, content, and campaign optimization strategies in order to improve user experience regardless of screen size.\n\nHere are 10 things that you can do to improve and optimize your screen for mobile usage:\n\n- Use a smaller number of features\n- Use bigger touch targets.\n- Offer enhanced scannability\n- Get better information uptake by showing a short content summary\n- Use relevant photos instead of icons\n- Provide room for full story titles without the need for scrolling\n- Show the publication date only as a divider\n- Add more space between navigation bars\n- Always label your drop-down menus\n\nEvery mobile screen has room for many user interface features. Even though a website might have a very small number of features, you can easily incorporate these 10 usability improvements.\n\nThere are also numerous ways to specifically optimize your site design for mobile usage.\n\nUse generous font sizes as they are usually better for web content. To make sure your message can be easily read, body copy should be set to at least 14 pts and headlines to 22 pts. You should keep in mind that any font smaller than 12 pts will be automatically resized to 12 pts on Apple devices, causing text to potentially wrap differently than you want it to. A single-column responsive layout works best but certain mobile operating systems (notably Android) will not scale web content to fit the screen (they use a standard median width of 480 px), and will therefore display only the left half of a website if it is designed with a two-column layout.\n\nProvide large CTAs in your email content. Your call to action (CTA) is the most important part of a marketing website and it should be eye-catching, well-placed, and above all easily usable. There are many ways and best practices for creating a successful CTA but they all depend on whether they are designed to be selected by a cursor or a finger. Apple’s iOS Human Interface Guidelines recommend a minimum “tappable” target area of 44 × 44 px. That does not mean that all buttons have to be 44 pixels, just that there should not be any buttons or links closer together than 44 pixels. Otherwise there is a risk of a “mistap.” Also, ergonomics are another thing that you should keep in mind when placing CTA buttons within your website. For instance, they should not be located in the lower right corner of the screen because it can be difficult for the user to click on it.\n\nAs well as optimizing design it is vital that you make your content suitable for mobile devises.\n\nKeep your headings relevant and clear because headings are one of the most important parts of your content. Keep your heading line short and simple; front-end load it with the most important information that is relevant to the content in a way that produces a compelling reason to read the content below.\n\nAlways use clear, concise web content. Think about the environment your website is being viewed in, and the screen size on which it will likely be viewed by the user. Overall mobile screen size is small when it comes to consuming web content on a variety of mobile devices, and users are more likely to be multitasking when they open your page on their mobile device. It is more important now than ever to engage the user as quickly as possible and to limit the amount of copy you include. Make sure that your website content can be easily scannable by using headers, bullet points, and short paragraphs of text whenever possible.\n\nThe most important thing is to always track how your users interact with the marketing efforts on your website and to give special attention to mobile usage. The data you have available should guide you in your future marketing and content optimisation efforts. You should aim to make your site suitable for all platforms as well as for all users, something we discussed in our blog post about using customer journey mapping. It is vital that you implement these strategies as it is almost guaranteed that mobile engagement will become more important in the near future.\n\nIf you have some techniques you have used to optimise your site or you think these techniques will improve your website and its mobile visibility then let us know by sending us a tweet at @EldingoLondon."
   },
   {
    "slug": "web-page-scrolling-and-attention",
    "title": "Web Page Scrolling and Attention",
    "date": "2015-11-29",
    "author": "Rebecca Moss",
    "hero": "/images/channel-dynamics-blog-17.jpg",
    "excerpt": "",
    "body": "A typical web user will spend 80 percent of their time staring at information that is located above the page fold. Although users often do not read immediately, but scroll instead, they spend only 20 percent of their time on the content below the fold.\n\nThere is much confusion among web designers about the page fold concept and the importance of keeping the most important information above the fold so it can be seen without the need for any additional user´s action.\n\nIn the first years of the Internet, users didn’t need to scroll as they just looked at the information and used it to decide if they are going to stay or leave. Usability studies that were conducted between 1994 and 1996 have shown that websites often failed if important information was below the fold. This unwillingness to scroll was logical at the time, because people were used to having PC´s show all their options.\n\nToday, users will scroll and scroll. However, this does not mean that you should create an endless scrolling page. Long scrolling pages are problematic because of the limited attention span that the user has. People prefer websites that get to the point immediately and let them get to do the key information quickly.\n\nIf you have a very long article, it will be better to show it as one scrolling page than to split it across multiple pages. Scrolling is better than dividing into pages because it is easier for users to scroll down the page than it is to decide whether or not to click through for the next page of an article divided into multiple pages, although publishers would advocate the use of multiple pages to improve their digital revenues.\n\n## Eyetracking research results\n\nA number of eyetracking research studies were conducted on the subject to see how users behave across a wide variety of websites. To find out if the fold is still as important, these research studies analyzed a total of 57,453 fixations which are instances when users look at something on a page, typically for less than half a second.\n\nBecause the main research goal of these studies was to generate new insight for the industry, they targeted large parts of the study to test:\n\n– webpages with new navigation features for the IA courses – corporate blogs – apps for the Application Design seminars.\n\nFor each of the above topics, it is perfectly correct to target a research and test webpages that have features that we would like to investigate. To do this, we would simply need to ask our test subjects to use a site that has the features we would like to investigate, but we would not want to draw their attention to that specific feature.\n\nIf we would deliberately ask some users to test webpages that have a particular design feature that is of interest to us, we would not be able to draw a conclusion that their behavior is representative. Users might scroll less often than they usually do if our content above the fold successfully keeps their attention highly focused.\n\nThese research studies also had a component that let website users to go to any site they chose, for the sake of the data that they were analyzing in the study. They tested the regular webpages that people often use rather than the webpages that they picked for testing their design features.\n\nEven with the fact that 5% of subjects´ total time was spent past the 2,000-pixel mark, they tend to scan information that far from the top fairly quickly and without reading at all.\n\nAccording to research studies, viewing time amongst web users was distributed as follows:\n\n– Above the fold: 80.3% – Below the fold: 19.7%\n\nEyetracker with a resolution of 1,024 × 768 pixels was used to conduct these studies. Today, most users have bigger displays, and although using a bigger screen would not change the research findings, it would increase the percentage of user attention spent above the fold simply because more content could be viewed.\n\n## Design Implications and Effects\n\nThe implications and effect are more than clear. The things that are the most important for the users’ goals or your business goals should still be located above the fold. Users indeed look below the fold, but not even close to as much as they look above the fold.\n\nVisitors will look very far down the page if the page layout encourages scanning, and if the initially viewable information gives them belief that it will be worth their time to scroll down and read more.\n\nTo conclude, while placing the most important information on top, you should not forget to add additional useful content further down the page, but with the anticipation that the engagement levels and click through rates are likely to be reduced."
   },
   {
    "slug": "a-user-experience-evaluation-of-travel-websites",
    "title": "A User Experience Evaluation of Millennials & Youth Travel Websites",
    "date": "2015-05-07",
    "author": "Rebecca Moss",
    "hero": "/images/channel-dynamics-blog-18.jpg",
    "excerpt": "",
    "body": "The millennial youth travel demographic represents a huge proportion of holiday-goers that research and book their trips using web and mobile. Long gone are the days of travel brochures and dealing with travel agents when planning a journey. So how can you make sure your service gives the best user experience for the travel hungry millennial audience?\n\nWe have completed extensive user journey mapping and looked at eight of the top youth travel sites. These include STA Travel, Trailfinders, Gapyear.com, Contiki, Realgap, Gap360, i-to-i and Geckos Adventures.\n\nThe steps in the journey were as follows:\n\n1. Finding an adventure\n\nAccording to Google’s research paper “The 2014 Traveller’s Road to Decision”, two-thirds of travellers research their holidays on web and mobile long before they actually decide where to go and how to get there. Many of these travellers go into planning a trip undecided on the company they will use. It is therefore important to engage these casual browsers with clear starting points on the homepage and inspiration for their adventure.\n\nImportant components to consider include:\n\n- a simple trip finder\n- offers and suggested itineraries\n- social sharing\n- credibility enhancers\n- teasers\n- bespoke service where possible.\n\nThe cost of an adventure has to be justified; therefore information needs to be presented not only about the trip but also about the value of the trip to the traveller. With a huge volume of information to present, it is also vital that good writing practices are followed throughout – both on web and mobile. Another powerful way to push information is through the use of video. According to research more than two-fifths of travellers’ are inspired to travel by YouTube content. 2. Making a commitment\n\nTrip fees need to be easy to find and once a decision is made it should be extremely easy for the visitor to take the next step to book the trip. According to OptiLead 2014, more than 8 out of 10 customers abandon online travel bookings. Call-to-action buttons need to be large and visually clear, with a good amount of breathing room around them making it easier to see and click on.\n\nFeaturing user-generated content at the point of purchase can also boost conversion by up to 7%. A consistent brand experience will use a number of channels to communicate with customers including desktop, smartphone and tablet devices.\n\n3. Preparing for the trip\n\nTravelling companions can make or break an experience. Travel providers should make a conscious effort to encourage travellers to interact with one another prior to their trip using forums, social connections and meet-ups.\n\nTravellers should also be supported with in-depth advice such as planning their journey, responsible travelling, safety precautions, and information on volunteering and working abroad.\n\n## In summary\n\nIn a world where an online purchase is more about the experience and where social marketing, video content and community-based information is becoming more important; it is clear that youth travel sites could do more to fill this gap in the customer journey. The Millennial Travel User Experience Evaluation will help you articulate your message clearly and provide a smooth user experience towards purchase, for your customers.\n\nAs technological developments advance at a phenomenal pace, the winner will be the company that is proactive rather than reactive to digital trends. They will be the ones who build more meaningful relationships with millennial travellers, and reap the rewards in terms of turnover and engagement."
   },
