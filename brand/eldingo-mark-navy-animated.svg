<svg xmlns="http://www.w3.org/2000/svg" viewBox="333 -6 52 109"><style>.halo{transform-box:fill-box;transform-origin:center;animation:ep 3.2s ease-in-out infinite}.bulb{transform-box:fill-box;transform-origin:50% 0;animation:es 4.5s ease-in-out infinite}@keyframes ep{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.34;transform:scale(1.18)}}@keyframes es{0%,100%{transform:rotate(0)}50%{transform:rotate(1.5deg)}}svg:hover .bulb{animation:ef .7s ease-out 1,ew 1.4s ease-in-out 1}svg:hover .ring{animation:er 1s ease-out 1}@keyframes ef{0%{filter:brightness(1)}20%{filter:brightness(.6)}35%{filter:brightness(1.35)}50%{filter:brightness(.9)}100%{filter:brightness(1.15)}}@keyframes ew{0%{transform:rotate(0)}25%{transform:rotate(-7deg)}55%{transform:rotate(5deg)}80%{transform:rotate(-2deg)}100%{transform:rotate(0)}}@keyframes er{0%{opacity:.7;r:11px}100%{opacity:0;r:36px}}@media(prefers-reduced-motion:reduce){.halo,.bulb{animation:none!important}}</style><circle class="halo" cx="358.92" cy="64.66" r="18.28" fill="#FFC83D" opacity="0.22"/><circle class="ring" cx="358.92" cy="64.66" r="11.42" fill="none" stroke="#FFC83D" stroke-width="1.5" opacity="0"/><rect class="stroke" x="353.21" y="0" width="11.42" height="39.98" rx="5.71" fill="#1B2A4A"/><g class="bulb"><path d="M351.96 53.26 c0 4.08 -5.04 4.80 -5.04 11.04 a12.00 12.00 0 1 0 23.99 0 c0 -6.24 -5.04 -6.96 -5.04 -11.04z" fill="#FFC83D"/><rect x="352.68" y="49.67" width="12.48" height="3.60" rx="1.20" fill="#1B2A4A"/><rect x="354.60" y="47.03" width="8.64" height="1.92" rx="0.96" fill="#1B2A4A"/></g></svg>